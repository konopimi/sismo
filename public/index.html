<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sismo API</title>
  <style>
    /* ===== RESET Y BASE ===== */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #eaeaea;
      overflow-y: scroll;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 12px 0;
    }

    #map {
      height: 500px;
      width: 100%;
      border-radius: 10px;
      border: 1px solid #333;
    }

    .crear {
      border: 1px solid gray;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: teal;
    }

    .crear form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    .crear form input,
    .crear form select {
      flex: 1 1 150px;
      min-width: 120px;
      padding: 10px 12px;
      font-size: 0.95rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    .crear form .gps-btn {
      flex: 0 0 auto;
      background: #333;
      padding: 10px 14px;
    }

    .crear form .gps-btn:hover {
      background: #444;
    }

    .crear form button[type="submit"] {
      flex: 1 1 100px;
      background: #d64545;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
    }

    .crear form button[type="submit"]:hover {
      background: #b53838;
    }

    /* ===== BOTÓN DE SUBIDA DE ARCHIVO PERSONALIZADO ===== */
    .custom-file-upload {
      display: inline-block;
      padding: 10px 16px;
      background: #2a2e36;
      color: #ddd;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.15s;
      border: 1px solid #444;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .custom-file-upload:hover {
      background: #3a3e46;
    }

    .custom-file-upload input[type="file"] {
      display: none;
    }

    .file-name {
      display: none;
      color: #999;
      font-size: 0.85rem;
      margin-left: 6px;
      flex: 1 1 120px;
      min-width: 80px;
      padding: 6px 0;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .tab-btn {
      flex: 1;
      min-width: 80px;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1a1d24;
      color: #888;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
    }

    .tab-btn.active {
      background: #d64545;
      color: white;
    }

    .tab-panel {
      display: none;
      padding: 5px;
    }

    .tab-panel.active {
      display: block;
    }

    /* ===== SEARCH ===== */
    .search-row {
      margin-bottom: 16px;
    }

    .search-row input[type="search"] {
      width: 100%;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    /* ===== LISTA ===== */
    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #1a1d24;
      border-radius: 10px;
      padding: 12px 14px;
      border-left: 4px solid #d64545;
      cursor: default;
      transition: background 0.15s;
    }

    .card:hover {
      background: #22262e;
    }

    .card.encontrado {
      border-left-color: #3fa34d;
    }

    .card .card-inner {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .card-photo {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: #12151c;
    }

    .card .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card .name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .card .meta {
      font-size: 0.8rem;
      color: #999;
    }

    .card .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
      pointer-events: auto;
    }

    .anuncio-text {
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      font-family: inherit;
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
      color: #eaeaea;
    }

    .btn-small {
      padding: 8px 12px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      background: #2a2e36;
      color: #ddd;
    }

    .btn-small:hover {
      filter: brightness(1.2);
    }

    .btn-small.btn-delete {
      background: #333;
      color: #ccc;
    }

    .btn-small.btn-delete:hover {
      background: #444;
    }

    .btn-small.btn-found {
      background: #3fa34d;
      color: white;
    }

    .btn-small.btn-missing {
      background: #d64545;
      color: white;
    }

    .btn-small.btn-seguro {
      background: #3fa34d;
      color: white;
    }

    .btn-small.btn-danado {
      background: #e0a63c;
      color: #222;
    }

    .btn-small.btn-colapsado {
      background: #b53838;
      color: white;
    }

    /* ===== STATUS TAGS ===== */
    .status-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 2px 10px;
      border-radius: 4px;
      background: #d64545;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: white;
    }

    .status-tag.encontrado,
    .status-tag.seguro {
      background: #3fa34d;
    }

    .status-tag.danado {
      background: #e0a63c;
      color: #222;
    }

    .status-tag.colapsado {
      background: #b53838;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 40px 0;
    }

    .photo-preview {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: modalFade 0.2s ease-out;
    }

    .modal.open {
      display: flex;
    }

    @keyframes modalFade {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content {
      background: #1a1d24;
      border-radius: 14px;
      padding: 24px 28px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      border: 1px solid #2a2e36;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2a2e36;
      border: none;
      color: #aaa;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close:hover {
      background: #3a3e46;
      color: #eee;
    }

    .modal-content h2 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
      padding-right: 30px;
      word-break: break-word;
    }

    .modal-status {
      display: inline-block;
      margin-bottom: 12px;
    }

    .modal-meta {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .modal-meta span {
      display: inline-block;
      margin-right: 12px;
    }

    .modal-divider {
      height: 1px;
      background: #2a2e36;
      margin: 16px 0;
    }

    .modal-photo {
      width: 100%;
      /* max-height: 280px; */
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2a2e36;
    }

    .modal-actions button {
      flex: 1;
      min-width: 80px;
    }

    .modal-actions .btn-small {
      flex: 1;
      min-width: 80px;
      padding: 10px 12px;
      font-size: 0.9rem;
      text-align: center;
    }

    #commentsList {
      margin-bottom: 12px;
    }

    .comment-item {
      background: #12151c;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 2px solid #d64545;
    }

    .comment-item .comment-text {
      color: #eaeaea;
      word-break: break-word;
    }

    .comment-item .comment-meta {
      font-size: 0.7rem;
      color: #888;
    }

    #commentForm {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #commentForm input {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
      min-width: 120px;
    }

    #commentForm button {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: #d64545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .modal-content {
        padding: 18px 16px 20px;
      }

      .modal-content h2 {
        font-size: 1.2rem;
      }

      .modal-actions button {
        min-width: 60px;
        font-size: 0.8rem;
        padding: 8px 10px;
      }

      .crear form input,
      .crear form select {
        flex: 1 1 100%;
      }

      .custom-file-upload {
        flex: 1 1 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <div style="padding: 5px">
    <h1>🚨 Sismo API - ADMIN: +57 3153410282</h1>
    <button id="copyLinkBtn"

  <!-- ===== DRIVER (TABS + SEARCH) ===== -->

  <!-- ===== PANEL EDIFICIOS ===== -->

  <script>
    // Mapeo de tipos de pestaña a elementos DOM
    const tabMap = {
      person: {btn: document.getElementById("tabPersonasBtn"), panel: document.getElementById("tabPersonas")},
      pet: {btn: document.getElementById("tabPetsBtn"), panel: document.getElementById("tabPets")},
      building: {btn: document.getElementById("tabEdificiosBtn"), panel: document.getElementById("tabEdificios")},
      anuncio: {btn: document.getElementById("tabAnunciosBtn"), panel: document.getElementById("tabAnuncios")},
      map: {btn: document.getElementById("tabMapBtn"), panel: document.getElementById("tabMapPanel")}
    };
    // Coordenadas de ciudades principales de Colombia
    // (Agrega más ciudades según necesites)
    const cityCoordinates = {
      "Bogotá": [4.7110, -74.0721],
      "Medellín": [6.2442, -75.5812],
      "Cali": [3.4516, -76.5320],
      "Barranquilla": [10.9639, -74.7968],
      "Cartagena": [10.3910, -75.4794],
      "Cúcuta": [7.8939, -72.5078],
      "Bucaramanga": [7.1193, -73.1227],
      "Pereira": [4.8133, -75.6961],
      "Santa Marta": [11.2408, -74.1990],
      "Ibagué": [4.4389, -75.2322],
      "Villavicencio": [4.1531, -73.6350],
      "Manizales": [5.0673, -75.5204],
      "Neiva": [2.9274, -75.2819],
      "Armenia": [4.5343, -75.6813],
      "Sincelejo": [9.3047, -75.3978],
      "Montería": [8.7499, -75.8759]
    };
    // ================================================================
    //  CONFIGURACIÓN
    // ================================================================
    const API_BASE = (location.hostname === "localhost" || location.hostname === "127.0.0.1")
      ? "https://sismoinfo.co/api"
      : "/api";

    const CLOUDINARY_CLOUD_NAME = "snaspwdz";
    const CLOUDINARY_UPLOAD_PRESET = "sismopinto";

    // ================================================================
    //  UTILIDADES
    // ================================================================
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function normalize(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function fuzzyMatch(query, target) {
      query = normalize(query);
      target = normalize(target);
      if (!query) return true;
      let qi = 0;
      for (let ti = 0; ti < target.length && qi < query.length; ti++) {
        if (target[ti] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function fuzzyFilter(query, items) {
      if (!query.trim()) return items;
      return items.filter(item =>
        fuzzyMatch(query, item.name) ||
        fuzzyMatch(query, item.location || "") ||
        fuzzyMatch(query, item.city || "")
      );
    }

    async function adminDelete(url) {
      const key = prompt("Clave de administrador:");
      if (!key) return false;
      const r = await fetch(url, {method: "DELETE", headers: {"x-admin-key": key}});
      if (r.status === 403) {alert("Clave incorrecta"); return false;}
      return true;
    }

    // ================================================================
    //  CARGA DE CIUDADES
    // ================================================================
    fetch("/cities.json")
      .then(r => r.json())
      .then(cities => {
        const opts = cities.map(c => `<option value="${c}">${c}</option>`).join("");
        document.getElementById("cityInput").insertAdjacentHTML("beforeend", opts);
        document.getElementById("cityInputP").insertAdjacentHTML("beforeend", opts);
        document.getElementById("cityInputB").insertAdjacentHTML("beforeend", opts);
        // Llenar el selector de ciudades del mapa y agregar evento
        const citySelectorMap = document.getElementById("citySelectorMap");
        if (citySelectorMap) {
          cities.forEach(c => {
            const option = document.createElement("option");
            option.value = c;
            option.textContent = c;
            citySelectorMap.appendChild(option);
          });
          citySelectorMap.addEventListener("change", function () {
            const city = this.value;
            if (city && window.map && cityCoordinates[city]) {
              const coords = cityCoordinates[city];
              window.map.flyTo(coords, 13, {duration: 0.3});
            }
          });
        }
      })
      .catch(() => console.error("No se pudo cargar cities.json"));

    // ================================================================
    //  SUBIDA A CLOUDINARY
    // ================================================================
    async function uploadPersonPhoto(personId, file) {
      const formData = new FormData();
      formData.append("file", file);

    function switchTab(activeBtn, activePanel, tabType) {
      // Desactivar todos los botones
      [tabPersonasBtn, tabPetsBtn, tabEdificiosBtn, tabAnunciosBtn, tabMapBtn].forEach(b => b && b.classList.remove("active"));
      // Activar el botón seleccionado
      activeBtn.classList.add("active");

      // Ocultar todos los paneles
      [tabPersonas, tabPets, tabEdificios, tabAnuncios, tabMapPanel].forEach(p => p && p.classList.remove("active"));
      // Mostrar el panel seleccionado
      activePanel.classList.add("active");

      // Ocultar todas las barras de búsqueda
      document.getElementById("searchPerson").style.display = "none";
      document.getElementById("searchPet").style.display = "none";
      document.getElementById("searchBuilding").style.display = "none";

      // Lógica específica según el tipo de tab
      if (tabType === "person") {
        document.getElementById("searchPerson").style.display = "block";
        document.getElementById("searchInput").value = "";
        render();  // Renderizar lista de personas
      } else if (tabType === "pet") {
        document.getElementById("searchPet").style.display = "block";
        document.getElementById("searchInputP").value = "";
        renderP(); // Renderizar lista de mascotas
      } else if (tabType === "building") {
        document.getElementById("searchBuilding").style.display = "block";
        document.getElementById("searchInputB").value = "";
        renderB(); // Renderizar lista de edificios
      } else if (tabType === "anuncio") {
        renderA(); // Renderizar anuncios (sin búsqueda)
      } else if (tabType === "map") {
        // Inicializar el mapa si no está creado
        if (!window.mapInitialized) {
          initMap(); // Esta función debe estar definida en el script posterior
          window.mapInitialized = true;
        }
        // Redimensionar el mapa después de que el panel se muestre
        setTimeout(() => {
          if (window.map) {
            window.map.invalidateSize();
          }
        }, 200);
      }

      // Actualizar la URL con el parámetro "tab" (sin recargar)
      const url = new URL(window.location);
      if (tabType) {
        url.searchParams.set("tab", tabType);
      } else {
        url.searchParams.delete("tab");
      }
      window.history.replaceState({}, "", url);
    }

          minute: "2-digit"

      if (item.location) metaParts.push(`🗺️ ${escapeHtml(item.location)}`);
      metaParts.push(`🕒 ${dateStr}`);
      modalMeta.innerHTML = metaParts.map(p => `<span>${p}</span>`).join("");

          imagesHtml = `<img class="modal-photo" src="${escapeHtml(item.image)}" alt="Imagen URL" />`;
        }
        modalBody.innerHTML = `
      ${imagesHtml}
      <label style="display:block; font-size:0.8rem; color:#999; margin-bottom:4px;">${item.photo_url ? "Cambiar foto" : "Agregar foto"}</label>

        style="width:100%; padding:8px; border-radius:8px; border:1px solid #333; background:#1a1d24; color:#eaeaea;" />
    `;
        // Remover listeners previos clonando el input
        const oldInput = document.getElementById("modalPhotoInput");
        const newInput = oldInput.cloneNode(true);
        oldInput.parentNode.replaceChild(newInput, oldInput);

          const file = e.target.files[0];
          if (!file) return;
          if (type === "person") {
            await uploadPersonPhoto(item.id, file);
            loadList();
          } else if (type === "pet") {
            await uploadPetPhoto(item.id, file);
            loadListP();

          closeModal();

            `<button class="btn-small btn-missing" onclick="setStatus('${item.id}','desaparecido','${type}'); closeModal();">Marcar desaparecido</button>`;
        } else {
          actionsHtml +=
            `<button class="btn-small btn-found" onclick="setStatus('${item.id}','encontrado','${type}'); closeModal();">Marcar encontrado</button>`;
        }
        actionsHtml +=
          `<button class="btn-small btn-delete" onclick="removeItem('${item.id}','${type}'); closeModal();">✕ Eliminar</button>`;
      } else if (type === "building") {
        actionsHtml +=
          `<button class="btn-small btn-seguro" onclick="setStatusB('${item.id}','seguro'); closeModal();">Seguro</button>`;
        actionsHtml +=
          `<button class="btn-small btn-danado" onclick="setStatusB('${item.id}','danado'); closeModal();">Dañado</button>`;
        actionsHtml +=
          `<button class="btn-small btn-colapsado" onclick="setStatusB('${item.id}','colapsado'); closeModal();">Colapsado</button>`;
        actionsHtml +=
          `<button class="btn-small btn-delete" onclick="removeB('${item.id}'); closeModal();">✕ Eliminar</button>`;
      }
      modalActions.innerHTML = actionsHtml;

      url.searchParams.set("type", type);

        urlPreviewP.src = "";
      }
      const file = photoInputP.files[0];
      if (photoPreviewP.src) {
        URL.revokeObjectURL(photoPreviewP.src);
        photoPreviewP.src = "";
        photoPreviewP.style.display = "none";
      }
      photoInputP.value = "";
      fileLabelP.textContent = "Sube una foto";
      if (file && created.id) {
        await uploadPetPhoto(created.id, file);
      }
      loadListP();
    });

    gpsBtnP.addEventListener("click", () => {
      if (!navigator.geolocation) {alert("Geolocalización no disponible."); return;}
      navigator.geolocation.getCurrentPosition(
        pos => {locationInputP.value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;},
        () => alert("No se pudo obtener la ubicación.")
      );
    });

    // ================================================================
    //  BUILDINGS (Edificios) - sin cambios
    // ================================================================
    let buildingsData = [];
    const listElB = document.getElementById("listB");
    const formB = document.getElementById("addFormB");
    const nameInputB = document.getElementById("nameInputB");
    const locationInputB = document.getElementById("locationInputB");
    const cityInputB = document.getElementById("cityInputB");
    const gpsBtnB = document.getElementById("gpsBtnB");
    const searchInputB = document.getElementById("searchInputB");

    async function loadListB() {
      try {
        const res = await fetch(`${API_BASE}/buildings`);
        buildingsData = await res.json();
        renderB();
        tryOpenModalFromUrl();
      } catch {
        listElB.innerHTML = `<div class="empty">No se pudo conectar al servidor.</div>`;
      }
    }

    function renderB() {
      const items = fuzzyFilter(searchInputB.value, buildingsData);
      if (!items.length) {
        listElB.innerHTML =
          `<div class="empty">${buildingsData.length ? "Sin resultados." : "No hay edificios reportados."}</div>`;
        return;
      }
      listElB.innerHTML = items.map(item => {
        const date = new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit", month: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });
        const metaParts = [];
        if (item.city) metaParts.push(escapeHtml(item.city));
        if (item.location) metaParts.push(escapeHtml(item.location));
        metaParts.push(date);
        const statusClass = item.status || "seguro";
        return `
          <div class="card ${statusClass}" data-id="${item.id}" data-type="building">
            <div><span class="status-tag ${statusClass}">${item.status || "seguro"}</span></div>
            <div class="card-inner">
              <div class="info">
                <span class="name">${escapeHtml(item.name)}</span>
                <span class="meta">${metaParts.join(" · ")}</span>
              </div>
            </div>
            <div class="actions">
              <button class="btn-small btn-seguro" onclick="setStatusB('${item.id}','seguro')">Seguro</button>
              <button class="btn-small btn-danado" onclick="setStatusB('${item.id}','danado')">Dañado</button>
              <button class="btn-small btn-colapsado" onclick="setStatusB('${item.id}','colapsado')">Colapsado</button>
              <button class="btn-small btn-delete" onclick="removeB('${item.id}')">✕</button>
            </div>
          </div>
        `;
      }).join("");
    }

    listElB.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      const card = e.target.closest(".card");
      if (!card) return;
      const id = card.dataset.id;
      const item = buildingsData.find(b => b.id === id);
      if (item) openModalForItem(item, "building");
    });

    searchInputB.addEventListener("input", renderB);

    formB.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInputB.value.trim();
      const location = locationInputB.value.trim();
      const city = cityInputB.value.trim();
      if (!name) return;
      await fetch(`${API_BASE}/buildings`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, location, city}),
      });
      nameInputB.value = "";
      locationInputB.value = "";
      cityInputB.value = "";
      loadListB();
    });

    gpsBtnB.addEventListener("click", () => {
      if (!navigator.geolocation) {alert("Geolocalización no disponible."); return;}
      navigator.geolocation.getCurrentPosition(
        pos => {locationInputB.value = `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;},
        () => alert("No se pudo obtener la ubicación.")
      );
    });

    // ================================================================
    //  MODAL: ya muestra imágenes para cualquier tipo
    //  La función openModalForItem() ya maneja person, pet y building
    //  con el mismo código. Para pets también mostrará image y photo_url.
    // ================================================================
    // (No se requiere cambio, pero se deja claro que el modal ya es compatible)

    // ================================================================
    //  ANUNCIOS
    // ================================================================
    let anunciosData = [];
    const listElA = document.getElementById("listA");
    const formA = document.getElementById("addFormA");
    const anuncioInput = document.getElementById("anuncioInput");

    async function loadListA() {
      try {
        const res = await fetch(`${API_BASE}/anuncios`);
        anunciosData = await res.json();
        renderA();
      } catch {
        listElA.innerHTML = `<div class="empty">No se pudo conectar al servidor.</div>`;
      }
    }

    function renderA() {
      if (!anunciosData.length) {
        listElA.innerHTML = `<div class="empty">No hay anuncios todavía.</div>`;
        return;
      }
      listElA.innerHTML = anunciosData.map(item => {
        const date = new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit", month: "2-digit",
          hour: "2-digit", minute: "2-digit"
        });
        return `
      <div class="card" data-id="${item.id}">
        <div class="info">
          <pre class="anuncio-text">${escapeHtml(item.text)}</pre>
          <span class="meta">${date}</span>
        </div>
        <div class="actions">
          <button class="btn-small btn-delete" onclick="removeA('${item.id}')">✕</button>
        </div>
      </div>
    `;
      }).join("");
    }
    formA.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = anuncioInput.value.trim();
      if (!text) return;
      await fetch(`${API_BASE}/anuncios`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({text}),
      });
      anuncioInput.value = "";
      loadListA();
    });

    async function removeA(id) {
      if (!confirm("¿Eliminar este anuncio?")) return;
      const ok = await adminDelete(`${API_BASE}/anuncios/${id}`);
      if (ok) loadListA();
    }

    // ================================================================
    //  ACCIONES COMPARTIDAS
    // ================================================================
    async function setStatus(id, status, type) {
      const endpoint = type === "person" ? "disappeared" : type === "pet" ? "pets" : "";
      if (!endpoint) return;
      await fetch(`${API_BASE}/${endpoint}/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      if (type === "person") loadList();
      else if (type === "pet") loadListP();
    }

    async function removeItem(id, type) {
      if (!confirm("¿Eliminar este reporte?")) return;
      const endpoint = type === "person" ? "disappeared" : type === "pet" ? "pets" : "";
      if (!endpoint) return;
      const ok = await adminDelete(`${API_BASE}/${endpoint}/${id}`);
      if (ok) {
        if (type === "person") loadList();
        else if (type === "pet") loadListP();
      }
    }

    async function setStatusB(id, status) {
      await fetch(`${API_BASE}/buildings/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      loadListB();
    }

    async function removeB(id) {
      if (!confirm("¿Eliminar este edificio?")) return;
      const ok = await adminDelete(`${API_BASE}/buildings/${id}`);
      if (ok) loadListB();
    }

    // ================================================================
    //  ABRIR MODAL DESDE URL
    // ================================================================
    let modalOpenedFromUrl = false;
    let urlModalAttempts = 0;
    const MAX_URL_ATTEMPTS = 6;

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {id: params.get("id"), type: params.get("type")};
    }

    function tryOpenModalFromUrl() {
      if (modalOpenedFromUrl) return true;
      const {id, type} = getUrlParams();
      if (!id || !type || type === "anuncio") return true;

      let dataArray = null;
      if (type === "person") dataArray = personsData;
      else if (type === "pet") dataArray = petsData;
      else if (type === "building") dataArray = buildingsData;
      else return true;

      if (!dataArray || dataArray.length === 0) return false;

      const item = dataArray.find(i => i.id === id);
      if (item) {
        if (type === "person") switchTab(tabPersonasBtn, tabPersonas, "person");
        else if (type === "pet") switchTab(tabPetsBtn, tabPets, "pet");
        else if (type === "building") switchTab(tabEdificiosBtn, tabEdificios, "building");
        setTimeout(() => {
          openModalForItem(item, type);
          modalOpenedFromUrl = true;
        }, 50);
        return true;
      }
      return false;
    }

    function attemptUrlModal() {
      if (modalOpenedFromUrl) return;
      if (urlModalAttempts >= MAX_URL_ATTEMPTS) return;
      urlModalAttempts++;
      const ok = tryOpenModalFromUrl();
      if (!ok) setTimeout(attemptUrlModal, 400);
    }

    // ================================================================
    //  INICIO Y AUTO-REFRESH
    // ================================================================
    loadList();
    loadListP();
    loadListB();
    loadListA();

    setTimeout(attemptUrlModal, 300);
    // Leer parámetro "tab" de la URL al cargar la página
    function applyTabFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get("tab");
      if (tab && tabMap[tab]) {
        const {btn, panel} = tabMap[tab];
        // Si la pestaña es la misma que la activa, no hacer nada (evita doble render)
        if (!btn.classList.contains("active")) {
          switchTab(btn, panel, tab);
        }
      }
      // Si no hay parámetro o es inválido, ya está activa "person" por defecto
    }

    // Ejecutar después de que todo esté cargado
    setTimeout(applyTabFromUrl, 100);


  </script>

  <!-- Leaflet CSS y JS para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    function initMap() {
      // Centro aproximado de Colombia
      const colombiaCenter = [4.5709, -74.2973];
      const map = L.map('map', {
        center: colombiaCenter,
        zoom: 6,
        minZoom: 5,
        maxBounds: [
          [-5.0, -82.0], // Suroeste (lat mín, lon mín)
          [13.0, -66.0]  // Noreste (lat máx, lon máx)
        ],
        maxBoundsViscosity: 1.0 // Evita que el usuario pueda arrastrar fuera de los límites
      });

      // Capa de OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Guardar referencia global para poder redimensionar
      window.map = map;

      // Opcional: marcador de ejemplo en Bogotá
      L.marker([4.7110, -74.0721])
        .addTo(map)
        .bindPopup('📍 Bogotá, Colombia');

      // Marcador en Medellín
      L.marker([6.2442, -75.5812])
        .addTo(map)
        .bindPopup('📍 Medellín, Colombia');

      console.log('Mapa de Colombia inicializado');
    }
  </script>
