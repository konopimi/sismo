<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SISMOINFO.CO</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    /* ===== RESET Y BASE ===== */
    * {
      box-sizing: border-box;
    }

    html {}

    body {
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      ont-size: 0.62rem;
      background: #0f1115;
      color: #eaeaea;
      min-height: 100vh;
      max-height: 100vh;
    }

    h1 {
      /* font-size: 1rem; */
      margin: 0 0 5px 0;
    }

    .name {

      text-transform: uppercase;
      font-size: 110%;
      margin-bottom: 5px;
    }

    #commentsContainer {
      flex: 1;
    }

    #tabMapPanel {
      display: flex;
      min-height: 100%;
      flex: 1;
    }

    #map {
      flex: 1;
      min-height: 100%;
      min-width: 100%;
    }

    .top-bar {
      position: sticky;
      top: 0px;
      background: rgba(62, 62, 62, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 2px solid rgb(127, 127, 127, 0.62);
      padding: 5px;
      z-index: 999;
    }

    .crear {
      border: 1px solid gray;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: teal;
    }

    /* Button that opens the creation modal (replaces inline forms) */
    .crear-btn {
      display: block;
      flex: 1;
      width: 100%;
      max-width: 100%;
      text-align: left;
      border: 1px solid gray;
      padding: 8px 10px;
      border-radius: 10px;
      margin-bottom: 8px;
      background: teal;
      color: palegoldenrod;
      font-weight: 700;
      cursor: pointer;
    }

    .crear-btn:hover {
      filter: brightness(1.1);
    }

    /* Each form inside the crear modal; only the active one is shown */
    .crear-form-wrap {
      display: none;
    }

    .crear-form-wrap.active {
      display: block;
    }

    /* Forms inside the modal reuse .crear form styling */
    #crearModal .crear-form-wrap form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    #crearModal .crear-form-wrap form select {

      max-width: 100px;
    }

    #crearModal .crear-form-wrap form input,
    #crearModal .crear-form-wrap form select {
      flex: 1 1 150px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    #crearModal .crear-form-wrap form .gps-btn {
      flex: 0 0 auto;
      background: #333;
      padding: 10px 14px;
    }

    #crearModal .crear-form-wrap form .gps-btn:hover {
      background: #444;
    }

    #crearModal .crear-form-wrap form button[type="submit"] {
      flex: 1 1 100px;
      background: #d64545;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: background 0.15s;
    }

    #crearModal .crear-form-wrap form button[type="submit"]:hover {
      background: #b53838;
    }

    .crear form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 6px;
      align-items: center;
    }

    .crear form input,
    .crear form select {
      flex: 1 1 150px;
      min-width: 120px;
      padding: 10px 12px;
      /* font-size: 0.95rem; */
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    .crear form .gps-btn {
      flex: 0 0 auto;
      background: #333;
      padding: 10px 14px;
    }

    .crear form .gps-btn:hover {
      background: #444;
    }

    .crear form button[type="submit"] {
      flex: 1 1 100px;
      background: #d64545;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      /* font-size: 0.95rem; */
      transition: background 0.15s;
    }

    .crear form button[type="submit"]:hover {
      background: #b53838;
    }

    /* ===== BOTÓN DE SUBIDA DE ARCHIVO PERSONALIZADO ===== */
    .custom-file-upload {
      position: relative;
      display: inline-block;
      padding: 10px 16px;
      background: #2a2e36;
      color: #ddd;
      border-radius: 8px;
      cursor: pointer;
      /* font-size: 0.95rem; */
      transition: background 0.15s;
      border: 1px solid #444;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .custom-file-upload:hover {
      background: #3a3e46;
    }

    .custom-file-upload input[type="file"] {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .file-name {
      display: none;
      color: #999;
      /* font-size: 0.85rem; */
      margin-left: 6px;
      flex: 1 1 120px;
      min-width: 80px;
      padding: 6px 0;
    }

    /* ===== TABS ===== */
    .tabs {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
    }

    button {

      min-width: 80px;
      padding: 5px;
      border-radius: 8px;
      border: 2px solid rgba(127, 127, 127, 0.62);
      background: rgba(10, 10, 10, 0.8);
      color: #888;
      /* font-size: 0.95rem; */
      cursor: pointer;
      transition: background 0.15s;
    }

    .tab-btn {
      /* flex: 1; */
      /* min-width: 80px; */
      /* padding: 5px; */
      /* border-radius: 8px; */
      /* border: 2px solid rgba(127, 127, 127, 0.62); */
      /* background: #1a1d24; */
      /* color: #888; */
      /* /* font-size: 0.95rem; */
      */
      /* cursor: pointer; */
      /* transition: background 0.15s; */
    }

    .tab-btn.active {
      background: #d64545;
      color: white;
    }

    /* live count badge on category tabs */
    .tab-btn .n {
      font-family: ui-monospace, monospace;
      /* font-size: 0.68rem; */
      font-weight: 700;
      padding: 1px 6px;
      margin-left: 5px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.22);
      color: inherit;
      vertical-align: middle;
    }

    .tab-btn.active .n {
      background: rgba(255, 255, 255, 0.22);
    }

    .tab-panel>button {
      margin-left: 40px;
    }

    .tab-panel {

      display: none;
      padding: 5px;
    }

    .tab-panel.active {
      display: block;
    }

    /* ===== SEARCH ===== */
    .search-row {}

    .search-row input[type="search"] {
      width: 100%;
      padding: 5px;
      /* font-size: 1rem; */
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    /* ===== LISTA ===== */
    .list {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      display: flex;
      background: #1a1d24;
      border-radius: 10px;
      border-left: 4px solid #d64545;
      cursor: default;
      transition: background 0.15s;
    }

    .card:hover {
      background: #22262e;
    }

    .card.encontrado {
      border-left-color: #3fa34d;
    }

    .card .card-inner {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-left: 5px;
    }

    .card-photo {
      width: 100px;
      min-height: 120px;
      max-height: 120px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
      background: #12151c;
    }

    .card-main {
      display: flex;
      flex-direction: column;
      flex: 1;
      padding: 5px;
    }

    .card .info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .card .name {
      font-weight: 600;
      /* font-size: 1.05rem; */
    }

    .card .meta {
      /* font-size: 0.8rem; */
      color: #999;
    }

    .card .actions {
      /* display: flex; */
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
      margin-left: auto;
      pointer-events: auto;
    }

    .anuncio-text {
      padding: 5px;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      font-family: inherit;
      margin: 0;
      /* font-size: 1.05rem; */
      font-weight: 600;
      color: #eaeaea;
    }

    .btn-small {
      padding: 8px 12px;
      /* font-size: 0.85rem; */
      border-radius: 6px;
      /* border: none; */
      cursor: pointer;
      transition: background 0.15s;
      background: #2a2e36;
      color: #ddd;
    }

    .btn-small:hover {
      filter: brightness(1.2);
    }

    .btn-small.btn-delete {
      background: #333;
      color: #ccc;
    }

    .btn-small.btn-delete:hover {
      background: #444;
    }

    .btn-small.btn-found {
      margin-left: auto;
      background: rgba(0, 200, 100, 0.8);
      color: white;
    }

    .btn-small.btn-missing {
      margin-left: auto;
      background: #d64545;
      color: white;
    }

    .btn-small.btn-seguro {
      background: #3fa34d;
      color: white;
    }

    .btn-small.btn-danado {
      background: #e0a63c;
      color: #222;
    }

    .btn-small.btn-colapsado {
      background: #b53838;
      color: white;
    }

    .gps-btn.has-location {
      background: #1e6b52;
    }

    .city-pin-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #4a4f5a;
      border: 2px solid #8a8f9a;
      opacity: 0.7;
    }

    .btn-small:disabled {
      opacity: 0.5;
      cursor: default;
      filter: none;
    }

    .map-search-result {
      padding: 8px 10px;
      cursor: pointer;
      /* font-size: 0.85rem; */
      border-bottom: 1px solid #2a2e36;
    }

    .map-search-result:hover {
      background: #22262e;
    }

    .map-search-result:last-child {
      border-bottom: none;
    }

    #mapPickerContainer {
      height: 320px;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 12px;
    }

    .extra-location-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: #12151c;
      border-radius: 8px;
      padding: 6px 10px;
      margin-bottom: 6px;
      /* font-size: 0.85rem; */
      flex-wrap: wrap;
    }

    .nearby-item {
      cursor: pointer;
      padding: 7px 10px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      /* font-size: 0.88rem; */
    }

    .nearby-item:hover {
      background: #1a1d24;
    }

    .nearby-item .nearby-dist {
      color: #888;
      /* font-size: 0.78rem; */
      flex: 0 0 auto;
    }

    #mapPickerContext {
      align-items: center;
      gap: 8px;
      background: #12151c;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 10px;
      /* font-size: 0.9rem; */
    }

    .btn-share {
      background: #1e6b52;
      color: #ccc;
    }

    .btn-share:hover {
      background: #24805f;
    }

    /* ===== STATUS TAGS ===== */
    .status-tag {
      margin-left: auto;
      text-transform: uppercase;
      padding: 5px;
      border-radius: 4px;
      background: #d64545;
      display: inline-block;
      letter-spacing: 0.3px;
      color: white;
      font-size: 80%;
    }

    .status-tag.encontrado,
    .status-tag.seguro {
      background: #3fa34d;
    }

    .status-tag.danado {
      background: #e0a63c;
      color: #222;
    }

    .status-tag.colapsado {
      background: #b53838;
    }

    .empty {
      display: none;
      text-align: center;
      color: #666;
      padding: 40px 0;
    }

    .photo-preview {
      width: 50px;
      height: 50px;
      object-fit: cover;
      border-radius: 8px;
    }

    /* ===== MODAL ===== */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: modalFade 0.2s ease-out;
    }

    .modal.open {
      display: flex;
    }

    @keyframes modalFade {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    #mapPickerContainer {
      height: min(100%, 600px);
    }

    .modal-content {
      display: flex;
      flex-direction: column;
      background: #1a1d24;
      border-radius: 14px;
      padding: 8px 9px 9px;
      max-width: min(1200px, 100%);
      width: 100%;
      height: 100%;
      max-height: 100%;
      overflow-y: auto;
      position: relative;
      border: 1px solid #2a2e36;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close:hover {
      background: #3a3e46;
      color: #eee;
    }

    .modal-content h2 {
      margin: 0 0 6px 0;
      /* font-size: 1.4rem; */
      padding-right: 30px;
      word-break: break-word;
    }

    .modal-status {
      display: inline-block;
      margin-bottom: 12px;
    }

    .modal-meta {
      /* font-size: 0.9rem; */
      color: #aaa;
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .modal-meta span {
      display: inline-block;
      margin-right: 12px;
    }

    .modal-divider {
      height: 1px;
      background: #2a2e36;
      margin: 16px 0;
    }

    .modal-photo {
      width: 100%;
      /* max-height: 280px; */
      object-fit: cover;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2a2e36;
    }

    .modal-actions button {
      flex: 1;
      min-width: 80px;
    }

    .modal-actions .btn-small {
      flex: 1;
      min-width: 80px;
      padding: 10px 12px;
      /* font-size: 0.9rem; */
      text-align: center;
    }

    #commentsList {
      flex: 1;
      margin-bottom: 12px;
    }

    .comment-badge {
      /* font-size: 0.78rem; */
      color: #9aa0a6;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 100%;
    }

    .comment-item {
      background: #12151c;
      border-radius: 8px;
      padding: 8px 12px;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 2px solid #d64545;
    }

    .comment-item .comment-text {
      color: #eaeaea;
      word-break: break-word;
      white-space: pre-wrap;
      word-wrap: break-word;
      overflow-wrap: break-word;
      font-family: inherit;
      margin: 0;
    }

    .comment-item .comment-meta {
      /* font-size: 0.7rem; */
      color: #888;
    }

    #commentForm {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    #commentForm textarea {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
      min-width: 120px;
      font-family: inherit;
      /* font-size: 0.95rem; */
      resize: vertical;
      min-height: 40px;
    }

    #commentForm button {
      flex: 0 0 auto;
      padding: 10px 16px;
      background: #d64545;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      .modal-content {
        padding: 18px 16px 20px;
      }

      .modal-content h2 {
        /* font-size: 1.2rem; */
      }

      .modal-actions button {
        min-width: 60px;
        /* font-size: 0.8rem; */
        padding: 8px 10px;
      }

      .crear form input,
      .crear form select {
        flex: 1 1 100%;
      }

      .custom-file-upload {
        flex: 1 1 100%;
        text-align: center;
      }
    }
  </style>
</head>

<body>

  <!-- ===== HEADER ===== -->
  <div class="top-bar" style="display:flex;align-items: center;">
    <img src="logo.png"
      style="max-height:30px;margin-right:13px;transform:scale(162%) translate(-5px,3px);z-index:999;" />
    <b style="flex:1;color:palegoldenrod;font-size:110%; ;">SISMOINFO.CO ⛑️</b>
    <button id="copyLinkBtn">
      🔗 LINK
    </button>
    <button id="shareAppBtn">
      📤 Compartir
    </button>

    <!-- <div id="apiTargetToggle" style="display:none;margin-left:auto;"> -->
    <!-- <button type="button" id="apiTargetRemote" class="btn-small" style="border-radius: 6px 0 0 6px;">🌏 </button> -->
    <!-- <button type="button" id="apiTargetLocal" class="btn-small" style="border-radius: 0 6px 6px 0;">🖥️ </button> -->

    <!-- </div> -->
  </div>
  <div style="display:none;padding:5px;">
    <div>+57 3153410282 @neokpm</div>
    <a style=" margin-left:auto;border-radius:5px;padding:3px;background:rgb(200,200,200);"
      href="https://colombiatebusca.com/">
      https://colombiatebusca.com/</a>
  </div>

  <!-- ===== DRIVER (TABS + SEARCH) ===== -->

  <!-- ===== PANEL PERSONAS ===== -->
  <div id="tabPersonas" class="tab-panel active">
    <button class="crear-btn" onclick="openCrearModal('person')">(+) CREAR PERSONA</button>
    <div id="list" class="list"></div>
  </div>

  <!-- ===== PANEL MASCOTAS ===== -->
  <div id="tabPets" class="tab-panel">
    <button class="crear-btn" onclick="openCrearModal('pet')">(+) CREAR MASCOTA</button>
    <div id="listP" class="list"></div>
  </div>

  <!-- ===== PANEL EDIFICIOS ===== -->
  <div id="tabEdificios" class="tab-panel">
    <button class="crear-btn" onclick="openCrearModal('building')">(+) CREAR UBICACIÓN</button>
    <div id="listB" class="list"></div>
  </div>

  <!-- ===== PANEL ANUNCIOS ===== -->
  <div id="tabAnuncios" class="tab-panel">
    <button class="crear-btn" onclick="openCrearModal('anuncio')">(+) CREAR ANUNCIO</button>
    <div id="listA" class="list"></div>
  </div>

  <!-- ===== PANEL COLABORADORES ===== -->
  <div id="tabColab" class="tab-panel">
    <button class="crear-btn" onclick="openCrearModal('colaborador')">(+) UNIRME COMO COLABORADOR</button>
    <div id="listColab" class="list"></div>
  </div>

  <!-- ===== PANEL MAPA ===== -->
  <div id="tabMapPanel" style="position:relative">
    <div style="margin-bottom:10px;">
      <!-- <label for="citySelectorMap" style="color:#ccc; margin-right:8px;">Ir a ciudad:</label> -->
      <select id="citySelectorMap" style="
          position:absolute;
          top:5px;
          right:5px;
          padding: 8px 12px;
          border-radius: 8px;
          border: 1px solid #333;
          background: rgba(10,10,10,0.8);
          color: #eaeaea;
          min-width: 150px;
          z-index:999;
        ">
        <option value="">-- 📍 IR A --</option>
      </select>
    </div>
    <div id="map" style=""></div>
  </div>

  <!-- ===== CREAR MODAL (all creation forms) ===== -->
  <div id="crearModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="crearModalTitle">
    <div class="modal-content" style="max-width:560px; max-height:90vh;">
      <button class="modal-close" id="crearModalClose" aria-label="Cerrar">✕</button>
      <h2 id="crearModalTitle">Crear</h2>
      <div class="modal-divider"></div>

      <!-- PERSONA -->
      <div class="crear-form-wrap" data-type="person">
        <form id="addForm">
          <input type="text" id="nameInput" placeholder="Nombre de la persona" required />
          <input type="text" id="locationInput" placeholder="Ubicación (opcional)" />
          <select id="cityInput">
            <option value="">Ciudad</option>
          </select>
          <button type="button" id="gpsBtn" class="gps-btn" title="Usar mi ubicación">📍</button>
          <span id="locationDisplay" style="font-size:62%; color:#666; min-width:120px;"></span>
          <div style="min-width: 100%;">
            🖼️ Dos opciones (URL o Subir imagen)
            <br />
            <input type="text" id="imageInput" placeholder="URL de imagen (opcional)" />
            <img id="urlPreview" class="photo-preview" style="display:none;" alt="Vista previa URL" />
            <label class="custom-file-upload">
              📷 Subir foto
              <input type="file" id="photoInput" accept="image/*" />
            </label>
            <span class="file-name" id="fileLabel">Sube una foto</span>
            <img id="photoPreview" class="photo-preview" style="display:none;" alt="Vista previa" />

    // ================================================================

    if (isLocalhost) {

    // ================================================================
    //  UTILIDADES
    // ================================================================
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function locationLinksHtml(lat, lng, coordLabel) {
      const label = coordLabel || `${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      return `<span class="loc-links">🗺️ ${label}</br> 
        <a href="#" onclick="viewOnAppMap(${lat},${lng});return false;" style="color:#4ea1ff;">Ver aquí</a> ·
        <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener" style="color:#4ea1ff;">Google Maps</a> ·
        <a href="https://waze.com/ul?ll=${lat},${lng}&navigate=yes" target="_blank" rel="noopener" style="color:#4ea1ff;">Waze</a></span>`;
    }

    function haversineDistance(lat1, lng1, lat2, lng2) {
      const R = 6371000;
      const toRad = (deg) => (deg * Math.PI) / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
        Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function nearbyItemsHtml(lat, lng, excludeId, excludeType) {
      const RADIUS_M = 1000;
      const candidates = [
        ...personsData.map((item) => ({item, type: "person"})),
        ...petsData.map((item) => ({item, type: "pet"})),
        ...buildingsData.map((item) => ({item, type: "building"})),
      ];
      const nearby = candidates
        .filter(({item, type}) => item.lat != null && item.lng != null && !(item.id === excludeId && type === excludeType))
        .map(({item, type}) => ({item, type, distance: haversineDistance(lat, lng, item.lat, item.lng)}))
        .filter(({distance}) => distance <= RADIUS_M)
        .sort((a, b) => a.distance - b.distance)
        .slice(0, 12);
      if (!nearby.length) {
        return `<div style="color:#666; font-size:0.85rem;">Sin items cercanos (menos de ${RADIUS_M / 1000}km).</div>`;
      }
      return nearby.map(({item, type, distance}) => {
        const emoji = MAP_MARKER_META[type] ? MAP_MARKER_META[type].emoji : "📍";
        const distLabel = distance < 1000 ? `${Math.round(distance)}m` : `${(distance / 1000).toFixed(1)}km`;
        return `<div class="nearby-item" data-nearby-id="${item.id}" data-nearby-type="${type}">
          <span>${emoji} ${escapeHtml(item.name)}</span>
          <span class="nearby-dist">${distLabel}</span>
        </div>`;
      }).join("");
    }

    // ================================================================
    //  VIRTUALIZACIÓN LIGERA DE LISTAS
    //  Renderiza en lotes y agrega más al acercarse al final, en vez de
    //  volcar cientos de tarjetas al DOM de una sola vez.
    // ================================================================
    const VIRTUAL_BATCH_SIZE = 30;
    const virtualObservers = new WeakMap();

    function renderVirtualList(containerEl, items, cardHtmlFn) {
      const prevObserver = virtualObservers.get(containerEl);
      if (prevObserver) prevObserver.disconnect();

      let rendered = Math.min(VIRTUAL_BATCH_SIZE, items.length);
      containerEl.innerHTML = items.slice(0, rendered).map(cardHtmlFn).join("") +
        `<div class="virtual-sentinel"></div>`;
      const sentinel = containerEl.querySelector(".virtual-sentinel");
      if (rendered >= items.length) {
        sentinel.remove();
        return;
      }
      const observer = new IntersectionObserver((entries) => {
        if (!entries[0].isIntersecting) return;
        const next = Math.min(rendered + VIRTUAL_BATCH_SIZE, items.length);
        sentinel.insertAdjacentHTML("beforebegin", items.slice(rendered, next).map(cardHtmlFn).join(""));
        rendered = next;
        if (rendered >= items.length) {
          observer.disconnect();
          sentinel.remove();
        }
      }, {rootMargin: "600px"});
      observer.observe(sentinel);
      virtualObservers.set(containerEl, observer);
    }

    async function loadExtraLocations(itemId, type) {
      const container = document.getElementById("modalExtraLocationsContainer");
      if (!container) return;
      const itemType = type === "person" ? "disappeared" : "pets";
      try {
        const res = await fetch(`${API_BASE}/item-locations?itemId=${itemId}&itemType=${itemType}`);
        const locations = await res.json();
        if (!locations.length) {
          container.innerHTML = `<div style="color:#666; font-size:0.85rem;">Ninguna todavía.</div>`;
          return;
        }
        container.innerHTML = locations.map(loc => `
          <div class="extra-location-item">
            <span>${locationLinksHtml(loc.lat, loc.lng, loc.label)}</span>
            <button type="button" class="btn-small btn-delete" onclick="deleteExtraLocation('${loc.id}','${itemId}','${type}')">✕</button>
          </div>
        `).join("");
      } catch {
        container.innerHTML = `<div style="color:#666; font-size:0.85rem;">No se pudieron cargar.</div>`;
      }
    }

    async function deleteExtraLocation(locationId, itemId, type) {
      if (!confirm("¿Eliminar esta ubicación adicional?")) return;
      const ok = await adminDelete(`${API_BASE}/item-locations/${locationId}`);
      if (ok) loadExtraLocations(itemId, type);
    }

    function viewOnAppMap(lat, lng) {
      closeModal();
      switchTab(tabMapBtn, tabMapPanel, "map");
      setTimeout(() => {
        if (window.map) window.map.flyTo([lat, lng], 16, {duration: 0.3});
      }, 250);
    }

    function commentBadgeHtml(item) {
      if (!item.last_comment) return "";
      const preview = item.last_comment.length > 60
        ? item.last_comment.slice(0, 60) + "…"
        : item.last_comment;
      const count = item.comment_count > 1 ? ` (${item.comment_count})` : "";
      return `<div class="comment-badge" title="${escapeHtml(item.last_comment)}">💬${count} ${escapeHtml(preview)}</div>`;
    }

    function normalize(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function fuzzyMatch(query, target) {
      query = normalize(query);
      target = normalize(target);
      if (!query) return true;
      let qi = 0;
      for (let ti = 0; ti < target.length && qi < query.length; ti++) {
        if (target[ti] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function fuzzyFilter(query, items) {
      if (!query.trim()) return items;
      return items.filter(item =>
        fuzzyMatch(query, item.name) ||
        fuzzyMatch(query, item.location || "") ||
        fuzzyMatch(query, item.city || "")
      );
    }

    async function adminDelete(url) {
      const key = prompt("Clave de administrador:");
      if (!key) return false;
      const r = await fetch(url, {method: "DELETE", headers: {"x-admin-key": key}});
      if (r.status === 403) {alert("Clave incorrecta"); return false;}
      return true;
    }

    // ================================================================
    //  CARGA DE CIUDADES

    fetch("/cities.json")
      .then(r => r.json())

    // ================================================================
    //  SUBIDA A CLOUDINARY
    // ================================================================
    async function uploadPersonPhoto(personId, file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (!data.secure_url) throw new Error("No se obtuvo secure_url");

        await fetch(`${API_BASE}/disappeared/${personId}/photo`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({photo_url: data.secure_url}),
        });
        return data.secure_url;
      } catch (err) {
        alert("El reporte se guardó, pero la foto no se pudo subir. Intenta agregarla de nuevo abriendo el reporte.");
        console.error(err);
        return null;
      }
    }

    //  COPIAR LINK
    // ================================================================

    // ================================================================
    //  COMPARTIR (Web Share API + fallback WhatsApp)
    // ================================================================
    async function shareContent(title, text, url) {
      if (navigator.share) {
        try {
          await navigator.share({title, text, url});
          return;
        } catch (err) {
          if (err && err.name === "AbortError") return;
        }
      }
      const waText = encodeURIComponent(url ? `${text}\n${url}` : text);
      window.open(`https://wa.me/?text=${waText}`, "_blank");
    }

    document.getElementById("shareAppBtn").addEventListener("click", () => {

    // ================================================================
    //  TABS
    // ================================================================
    const tabPersonasBtn = document.getElementById("tabPersonasBtn");
    const tabPetsBtn = document.getElementById("tabPetsBtn");

    const tabAnunciosBtn = document.getElementById("tabAnunciosBtn");

    const tabEdificios = document.getElementById("tabEdificios");
    const tabAnuncios = document.getElementById("tabAnuncios");
    const tabColab = document.getElementById("tabColab");
    const tabMapPanel = document.getElementById("tabMapPanel");

    function switchTab(activeBtn, activePanel, tabType) {
      // Desactivar todos los botones
      [tabPersonasBtn, tabPetsBtn, tabEdificiosBtn, tabAnunciosBtn, tabColabBtn, tabMapBtn].forEach(b => b && b.classList.remove("active"));
      // Activar el botón seleccionado
      activeBtn.classList.add("active");

      // Ocultar todos los paneles
      [tabPersonas, tabPets, tabEdificios, tabAnuncios, tabColab, tabMapPanel].forEach(p => p && p.classList.remove("active"));
      // Mostrar el panel seleccionado
      activePanel.classList.add("active");

      // Ocultar todas las barras de búsqueda
      document.getElementById("searchPerson").style.display = "none";
      document.getElementById("searchPet").style.display = "none";
      document.getElementById("searchBuilding").style.display = "none";

      // Lógica específica según el tipo de tab
      if (tabType === "person") {
        document.getElementById("searchPerson").style.display = "block";
        document.getElementById("searchInput").value = "";
        render();  // Renderizar lista de personas
      } else if (tabType === "pet") {
        document.getElementById("searchPet").style.display = "block";
        document.getElementById("searchInputP").value = "";
        renderP(); // Renderizar lista de mascotas
      } else if (tabType === "building") {
        document.getElementById("searchBuilding").style.display = "block";
        document.getElementById("searchInputB").value = "";
        renderB(); // Renderizar lista de edificios
      } else if (tabType === "anuncio") {
        renderA(); // Renderizar anuncios (sin búsqueda)
      } else if (tabType === "colaborador") {
        renderColab(); // Renderizar colaboradores (sin búsqueda)
      } else if (tabType === "map") {
        // Inicializar el mapa si no está creado
        if (!window.mapInitialized) {
          initMap(); // Esta función debe estar definida en el script posterior
          window.mapInitialized = true;
        }
        // Redimensionar el mapa después de que el panel se muestre
        setTimeout(() => {
          if (window.map) {
            window.map.invalidateSize();
            renderMapMarkers();
          }
        }, 200);
      }

      // Actualizar la URL con el parámetro "tab" (sin recargar)
      const url = new URL(window.location);
      if (tabType) {
        url.searchParams.set("tab", tabType);
      } else {
        url.searchParams.delete("tab");
      }
      window.history.replaceState({}, "", url);
    }
    tabPersonasBtn.addEventListener("click", () => switchTab(tabPersonasBtn, tabPersonas, "person"));
    tabPetsBtn.addEventListener("click", () => switchTab(tabPetsBtn, tabPets, "pet"));
    tabEdificiosBtn.addEventListener("click", () => switchTab(tabEdificiosBtn, tabEdificios, "building"));
    tabAnunciosBtn.addEventListener("click", () => switchTab(tabAnunciosBtn, tabAnuncios, "anuncio"));
    tabColabBtn.addEventListener("click", () => switchTab(tabColabBtn, tabColab, "colaborador"));
    tabMapBtn.addEventListener("click", () => switchTab(tabMapBtn, tabMapPanel, "map"));

    // ================================================================
    //  CREAR MODAL
    //  Unified modal hosting all creation forms. Only the form matching
    //  the requested type is shown; the others stay hidden.
    // ================================================================
    const crearModal = document.getElementById("crearModal");
    const crearModalTitle = document.getElementById("crearModalTitle");
    const crearModalClose = document.getElementById("crearModalClose");
    const crearFormWraps = crearModal.querySelectorAll(".crear-form-wrap");

    const CREAR_META = {
      person: {title: "Crear persona"},
      pet: {title: "Crear mascota"},
      building: {title: "Crear ubicación"},
      anuncio: {title: "Crear anuncio"},
      colaborador: {title: "Unirme como colaborador"},
    };

    function openCrearModal(type) {
      if (!CREAR_META[type]) type = "person";
      crearModalTitle.textContent = CREAR_META[type].title;
      crearFormWraps.forEach(w => {
        w.classList.toggle("active", w.dataset.type === type);
      });
      crearModal.classList.add("open");
    }

    function closeCrearModal() {
      crearModal.classList.remove("open");
    }

    crearModalClose.addEventListener("click", closeCrearModal);
    crearModal.addEventListener("click", (e) => {
      if (e.target === crearModal) closeCrearModal();
    });

    // Top (+) CREAR!!! button: open modal for the currently active tab.
    document.getElementById("crear").addEventListener("click", () => {
      const activeBtn = document.querySelector(".tab-btn.active");
      let type = "person";
      if (activeBtn) {
        const id = activeBtn.id;
        if (id === "tabPetsBtn") type = "pet";
        else if (id === "tabEdificiosBtn") type = "building";
        else if (id === "tabAnunciosBtn") type = "anuncio";
        else if (id === "tabColabBtn") type = "colaborador";
      }
      openCrearModal(type);
    });

    // ================================================================
    //  MODAL
    // ================================================================
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalStatus = document.getElementById("modalStatus");
    const modalMeta = document.getElementById("modalMeta");
    const modalBody = document.getElementById("modalBody");
    const modalActions = document.getElementById("modalActions");
    const modalClose = document.querySelector(".modal-close");

    let currentItemId = null;
    let currentItemType = null;

    function closeModal() {
      modal.classList.remove("open");
      modalTitle.textContent = "";
      modalStatus.innerHTML = "";
      modalMeta.innerHTML = "";
      modalBody.innerHTML = "";
      modalActions.innerHTML = "";
      document.getElementById("commentsList").innerHTML = "";
      document.getElementById("commentInput").value = "";
      currentItemId = null;
      currentItemType = null;
      if (modalMiniMap) {
        modalMiniMap.remove();
        modalMiniMap = null;
      }
      const url = new URL(window.location);
      url.searchParams.delete("id");
      url.searchParams.delete("type");
      window.history.replaceState({}, "", url);
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {if (e.target === modal) closeModal();});
    document.addEventListener("keydown", (e) => {
      if (e.key !== "Escape") return;
      if (crearModal.classList.contains("open")) closeCrearModal();
      if (modal.classList.contains("open")) closeModal();
      if (mapModal.classList.contains("open")) closeMapPicker();
    });

    // ----- Selector de ubicación en mapa -----
    const CALI_CENTER = [3.4516, -76.532];
    let mapPickerContext = null; // "person" | "pet" | "building" | "modalItem"
    const mapPickerLat = {person: null, pet: null, building: null};
    const mapPickerLng = {person: null, pet: null, building: null};
    let modalLocationTarget = null; // {id, type} cuando se edita ubicación desde el modal
    let modalExtraLocationTarget = null; // {id, type} cuando se agrega una ubicación adicional
    let leafletMap = null;
    let leafletMarker = null;
    let modalMiniMap = null;

    const mapModal = document.getElementById("mapModal");
    const mapModalClose = document.getElementById("mapModalClose");
    const mapPickerConfirm = document.getElementById("mapPickerConfirm");
    const mapPickerLatInput = document.getElementById("mapPickerLatInput");
    const mapPickerLngInput = document.getElementById("mapPickerLngInput");
    const mapPickerGoBtn = document.getElementById("mapPickerGoBtn");

    function openMapPicker(context) {
      mapPickerContext = context;
      mapModal.classList.add("open");

      if (!leafletMap) {
        leafletMap = L.map("mapPickerContainer").setView(CALI_CENTER, 13);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap",
        }).addTo(leafletMap);
        leafletMarker = L.marker(CALI_CENTER, {draggable: true}).addTo(leafletMap);
        leafletMap.on("click", (e) => {
          leafletMarker.setLatLng(e.latlng);
          syncPickerInputs(e.latlng.lat, e.latlng.lng);
        });
        leafletMarker.on("dragend", () => {
          const ll = leafletMarker.getLatLng();
          syncPickerInputs(ll.lat, ll.lng);
        });
      }

      let existingLat = mapPickerLat[context];
      let existingLng = mapPickerLng[context];
      const mapPickerContextEl = document.getElementById("mapPickerContext");
      mapPickerContextEl.style.display = "none";
      mapPickerContextEl.innerHTML = "";
      if (context === "modalItem" && modalLocationTarget) {
        const dataArr = modalLocationTarget.type === "building" ? buildingsData
          : modalLocationTarget.type === "person" ? personsData : petsData;
        const target = dataArr.find(i => i.id === modalLocationTarget.id);
        if (target && target.lat != null && target.lng != null) {
          existingLat = target.lat;
          existingLng = target.lng;
        }
        if (target) {
          const emoji = MAP_MARKER_META[modalLocationTarget.type]
            ? MAP_MARKER_META[modalLocationTarget.type].emoji
            : "📍";
          const photo = target.photo_url || target.image;
          mapPickerContextEl.innerHTML = `
            ${photo ? `<img src="${escapeHtml(photo)}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex:0 0 auto;" />` : ""}
            <span style="font-weight:600;">${emoji} ${escapeHtml(target.name)}</span>
            <span style="color:#999;">${target.location ? escapeHtml(target.location) : (target.lat != null ? "Ubicación actual en el mapa" : "Sin ubicación todavía")}</span>
          `;
          mapPickerContextEl.style.display = "flex";
        }
      } else if (context === "modalItemExtra" && modalExtraLocationTarget) {
        const dataArr = modalExtraLocationTarget.type === "person" ? personsData : petsData;
        const target = dataArr.find(i => i.id === modalExtraLocationTarget.id);
        existingLat = null;
        existingLng = null;
        if (target) {
          const emoji = MAP_MARKER_META[modalExtraLocationTarget.type]
            ? MAP_MARKER_META[modalExtraLocationTarget.type].emoji
            : "📍";
          const photo = target.photo_url || target.image;
          mapPickerContextEl.innerHTML = `
            ${photo ? `<img src="${escapeHtml(photo)}" alt="" style="width:36px;height:36px;border-radius:8px;object-fit:cover;flex:0 0 auto;" />` : ""}
            <span style="font-weight:600;">${emoji} ${escapeHtml(target.name)}</span>
            <span style="color:#999;">Marca otra ubicación donde pudo haber sido visto/a</span>
          `;
          mapPickerContextEl.style.display = "flex";
        }
      }
      if (existingLat != null && existingLng != null) {
        leafletMarker.setLatLng([existingLat, existingLng]);
        leafletMap.setView([existingLat, existingLng], 15);
        syncPickerInputs(existingLat, existingLng);
      } else if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            const ll = [pos.coords.latitude, pos.coords.longitude];
            leafletMarker.setLatLng(ll);
            leafletMap.setView(ll, 15);
            syncPickerInputs(ll[0], ll[1]);
          },
          () => {
            syncPickerInputs(CALI_CENTER[0], CALI_CENTER[1]);
          },
        );
      } else {
        syncPickerInputs(CALI_CENTER[0], CALI_CENTER[1]);
      }

      // Leaflet necesita recalcular el tamaño una vez el modal ya es visible.
      setTimeout(() => leafletMap.invalidateSize(), 50);
    }

    function closeMapPicker() {
      mapModal.classList.remove("open");
      mapPickerContext = null;
      mapSearchInput.value = "";
      mapSearchResults.style.display = "none";
      mapSearchResults.innerHTML = "";
    }

    mapModalClose.addEventListener("click", closeMapPicker);
    mapModal.addEventListener("click", (e) => {
      if (e.target === mapModal) closeMapPicker();
    });

    function syncPickerInputs(lat, lng) {
      mapPickerLatInput.value = lat.toFixed(6);
      mapPickerLngInput.value = lng.toFixed(6);
    }

    mapPickerGoBtn.addEventListener("click", () => {
      const lat = parseFloat(mapPickerLatInput.value);
      const lng = parseFloat(mapPickerLngInput.value);
      if (!Number.isFinite(lat) || !Number.isFinite(lng) || lat < -90 || lat > 90 || lng < -180 || lng > 180) {
        alert("Coordenadas inválidas. Latitud entre -90 y 90, longitud entre -180 y 180.");
        return;
      }
      leafletMarker.setLatLng([lat, lng]);
      leafletMap.setView([lat, lng], 15);
    });

    const mapSearchInput = document.getElementById("mapSearchInput");
    const mapSearchResults = document.getElementById("mapSearchResults");
    let mapSearchDebounce = null;
    let mapSearchAbort = null;

    mapSearchInput.addEventListener("input", () => {
      clearTimeout(mapSearchDebounce);
      const q = mapSearchInput.value.trim();
      if (q.length < 3) {
        mapSearchResults.style.display = "none";
        mapSearchResults.innerHTML = "";
        return;
      }
      mapSearchDebounce = setTimeout(() => runMapSearch(q), 500);
    });

    async function runMapSearch(query) {
      if (mapSearchAbort) mapSearchAbort.abort();
      mapSearchAbort = new AbortController();
      try {
        const url = `https://nominatim.openstreetmap.org/search?format=json&addressdetails=0&limit=6&countrycodes=co&q=${encodeURIComponent(query)}`;
        const res = await fetch(url, {
          signal: mapSearchAbort.signal,
          headers: {"Accept-Language": "es"},
        });
        const results = await res.json();
        renderMapSearchResults(results);
      } catch (err) {
        if (err.name !== "AbortError") console.error(err);
      }
    }

    function renderMapSearchResults(results) {
      if (!results.length) {
        mapSearchResults.innerHTML = `<div class="map-search-result" style="color:#666; cursor:default;">Sin resultados</div>`;
        mapSearchResults.style.display = "block";
        return;
      }
      mapSearchResults.innerHTML = results.map((r, i) =>
        `<div class="map-search-result" data-index="${i}">${escapeHtml(r.display_name)}</div>`
      ).join("");
      mapSearchResults.style.display = "block";

      mapSearchResults.querySelectorAll(".map-search-result[data-index]").forEach(el => {
        el.addEventListener("click", () => {
          const r = results[el.dataset.index];
          const lat = parseFloat(r.lat);
          const lng = parseFloat(r.lon);
          leafletMarker.setLatLng([lat, lng]);
          leafletMap.setView([lat, lng], 16);
          syncPickerInputs(lat, lng);
          mapSearchResults.style.display = "none";
          mapSearchInput.value = r.display_name;
        });
      });
    }

    document.addEventListener("click", (e) => {
      if (!mapSearchResults.contains(e.target) && e.target !== mapSearchInput) {
        mapSearchResults.style.display = "none";
      }
    });

    mapPickerConfirm.addEventListener("click", async () => {
      if (!mapPickerContext) return;
      const typedLat = parseFloat(mapPickerLatInput.value);
      const typedLng = parseFloat(mapPickerLngInput.value);
      const lat = Number.isFinite(typedLat) ? typedLat : (leafletMarker ? leafletMarker.getLatLng().lat : null);
      const lng = Number.isFinite(typedLng) ? typedLng : (leafletMarker ? leafletMarker.getLatLng().lng : null);
      if (lat == null || lng == null) return;


      if (mapPickerContext === "modalItem" && modalLocationTarget) {
        const {id, type} = modalLocationTarget;
        const endpoint = type === "building" ? "buildings" : type === "person" ? "disappeared" : "pets";
        await fetch(`${API_BASE}/${endpoint}/${id}`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({lat, lng}),
        });
        modalLocationTarget = null;
        closeMapPicker();
        if (type === "building") await loadListB();
        else if (type === "person") await loadList();
        else await loadListP();
        const dataArr = type === "building" ? buildingsData : type === "person" ? personsData : petsData;
        const updated = dataArr.find(i => i.id === id);
        if (updated) openModalForItem(updated, type);
        return;
      }

      if (mapPickerContext === "modalItemExtra" && modalExtraLocationTarget) {
        const {id, type} = modalExtraLocationTarget;
        const itemType = type === "person" ? "disappeared" : "pets";
        await fetch(`${API_BASE}/item-locations`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({itemId: id, itemType, lat, lng}),
        });
        modalExtraLocationTarget = null;
        closeMapPicker();
        loadExtraLocations(id, type);
        return;
      }

      mapPickerLat[mapPickerContext] = lat;
      mapPickerLng[mapPickerContext] = lng;
      const btnByContext = {person: gpsBtn, pet: gpsBtnP, building: gpsBtnB};
      const btn = btnByContext[mapPickerContext];
      if (btn) {
        btn.classList.add("has-location");
        btn.title = `Ubicación guardada: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      }
      // Update location display in the corresponding form
      const displayByContext = {
        person: document.getElementById("locationDisplay"),
        pet: document.getElementById("locationDisplayP"),
        building: document.getElementById("locationDisplayB"),
      };
      const display = displayByContext[mapPickerContext];
      if (display) display.innerHTML = `<a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" style="color:#4ea1ff;">🗺️ ${lat.toFixed(5)}, ${lng.toFixed(5)}</a>`;
      closeMapPicker();
    });

    function initModalMiniMap(lat, lng) {
      if (modalMiniMap) {
        modalMiniMap.remove();
        modalMiniMap = null;
      }
      setTimeout(() => {
        const container = document.getElementById("modalMiniMapContainer");
        if (!container) return; // el modal pudo haberse cerrado ya
        modalMiniMap = L.map("modalMiniMapContainer", {
          zoomControl: false,
          dragging: false,
          scrollWheelZoom: false,
          doubleClickZoom: false,
        }).setView([lat, lng], 16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "&copy; OpenStreetMap",
        }).addTo(modalMiniMap);
        L.marker([lat, lng]).addTo(modalMiniMap);
        modalMiniMap.invalidateSize();
      }, 50);
    }

    function openModalForItem(item, type) {
      const commentsContainer = document.getElementById("commentsContainer");

      // --- Soporte para anuncios en el modal ---
      if (type === "anuncio") {
        modalStatus.innerHTML = "";
        modalTitle.textContent = "Anuncio";
        modalMeta.innerHTML = `
          <span>🕒 ${new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        })}</span>
        `;
        modalBody.innerHTML = `<div style="white-space:pre-wrap;">${escapeHtml(item.text)}</div>`;
        modalActions.innerHTML = isLocalhost
          ? `
            <button class="btn-small btn-share" onclick="shareAnuncio('${item.id}'); closeModal();">📤 Compartir</button>
            <button class="btn-small btn-delete" onclick="removeA('${item.id}'); closeModal();">✕ Eliminar</button>
          `
          : `
            <button class="btn-small btn-share" onclick="shareAnuncio('${item.id}'); closeModal();">📤 Compartir</button>
          `;
        commentsContainer.style.display = "";
        modal.classList.add("open");
        loadComments(item.id, "anuncios");
        return;
      } else {
        commentsContainer.style.display = "";
      }

      // --- Resto del código existente para personas, mascotas y edificios ---
      const statusClass = item.status || "desaparecido";
      const statusLabel = item.status || "desaparecido";
      modalStatus.innerHTML = `<span class="status-tag ${statusClass}">${statusLabel}</span>`;
      modalTitle.textContent = item.name || "Sin nombre";

      const dateStr = item.created_at
        ? new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit",
          month: "2-digit",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit"
        })
        : "";
      const metaParts = [];
      if (item.city) metaParts.push(`📍 ${escapeHtml(item.city)}`);
      if (item.location) metaParts.push(`🗺️ ${escapeHtml(item.location)}`);
      if (item.lat != null && item.lng != null) metaParts.push(locationLinksHtml(item.lat, item.lng));
      metaParts.push(`🕒 ${dateStr}`);
      modalMeta.innerHTML = metaParts.map(p => `<span>${p}</span>`).join("");

      // --- Cuerpo del modal: imágenes y subida de foto (para personas y mascotas) ---
      if (type === "person" || type === "pet") {
        const hasLoc = item.lat != null && item.lng != null;
        let imagesHtml = "";
        if (item.photo_url) {
          imagesHtml = `<img class="modal-photo" src="${escapeHtml(item.photo_url)}" alt="Foto subida" />`;
        } else if (item.image) {
          imagesHtml = `<img class="modal-photo" src="${escapeHtml(item.image)}" alt="Imagen URL" />`;
        }

        modalBody.innerHTML = `
      ${imagesHtml}
      ${hasLoc ? `<div id="modalMiniMapContainer" style="height:min(60vh,600px);border-radius:10px; margin-bottom:10px; overflow:hidden;"></div>` : ""}
      <button type="button" class="btn-small" id="modalSetLocationBtn" style="margin-bottom:10px;">📍 ${hasLoc ? "Cambiar ubicación" : "Agregar ubicación"}</button>
      <div style="margin-bottom:14px;">
        <div style="color:#999; margin-bottom:6px;">📍 Otras ubicaciones posibles</div>
        <div id="modalExtraLocationsContainer" style="margin-bottom:6px;"></div>
        <button type="button" class="btn-small" id="modalAddExtraLocationBtn">+ Agregar otra ubicación posible</button>
      </div>
      <label style="display:block; color:#999; margin-bottom:4px;">${item.photo_url ? "Cambiar foto" : "Agregar foto"}</label>
      <input type="file" accept="image/*" id="modalPhotoInput"
        style="width:100%; padding:8px; border-radius:8px; border:1px solid #333; background:#1a1d24; color:#eaeaea;" />
    `;
        document.getElementById("modalSetLocationBtn").addEventListener("click", () => {
          modalLocationTarget = {id: item.id, type};
          openMapPicker("modalItem");
        });
        document.getElementById("modalAddExtraLocationBtn").addEventListener("click", () => {
          modalExtraLocationTarget = {id: item.id, type};
          openMapPicker("modalItemExtra");
        });
        loadExtraLocations(item.id, type);
        // Remover listeners previos clonando el input
        const oldInput = document.getElementById("modalPhotoInput");
        const newInput = oldInput.cloneNode(true);
        oldInput.parentNode.replaceChild(newInput, oldInput);
        newInput.addEventListener("change", async (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (type === "person") {
            await uploadPersonPhoto(item.id, file);
            loadList();
          } else if (type === "pet") {
            await uploadPetPhoto(item.id, file);
            loadListP();
          }
          closeModal();
        });
        if (hasLoc) initModalMiniMap(item.lat, item.lng);
      } else if (type === "building") {
        const hasLoc = item.lat != null && item.lng != null;
        modalBody.innerHTML = `
          ${hasLoc ? `<div id="modalMiniMapContainer" style="height:min(60vh,600px); border-radius:10px; margin-bottom:10px; overflow:hidden;"></div>` : ""}
          <div style="color:#888; margin-bottom:8px;">
            ${hasLoc
            ? `📐 ${locationLinksHtml(item.lat, item.lng)}`
            : "Este lugar no tiene ubicación en el mapa todavía."}
          </div>
          <button type="button" class="btn-small" id="modalSetLocationBtn">📍 ${hasLoc ? "Cambiar ubicación" : "Agregar ubicación"}</button>
          ${hasLoc ? `
            <div style="margin-top:14px;">
              <div style="color:#999;  margin-bottom:6px;">📍 Items cercanos (menos de 1km)</div>
              <div id="modalNearbyContainer">${nearbyItemsHtml(item.lat, item.lng, item.id, "building")}</div>
            </div>
          ` : ""}
        `;
        document.getElementById("modalSetLocationBtn").addEventListener("click", () => {
          modalLocationTarget = {id: item.id, type: "building"};
          openMapPicker("modalItem");
        });
        const nearbyContainer = document.getElementById("modalNearbyContainer");
        if (nearbyContainer) {
          nearbyContainer.addEventListener("click", (e) => {
            const row = e.target.closest("[data-nearby-id]");
            if (!row) return;
            const nId = row.dataset.nearbyId;
            const nType = row.dataset.nearbyType;
            const arr = nType === "person" ? personsData : nType === "pet" ? petsData : buildingsData;
            const nItem = arr.find((x) => x.id === nId);
            if (nItem) openModalForItem(nItem, nType);
          });
        }
        if (hasLoc) initModalMiniMap(item.lat, item.lng);
      } else {
        modalBody.innerHTML = `<div style="color:#888;">Detalles del reporte</div>`;
      }

      // --- Acciones del modal (botones) ---
      let actionsHtml = "";
      if (type === "person" || type === "pet" || type === "building") {
        actionsHtml += `<button type="button" class="btn-small" onclick="copyItemLink('${item.id}','${type}', this)">🔗 Copiar enlace</button>`;
      }
      if (type === "person" || type === "pet") {
        if (item.status === "encontrado") {
          actionsHtml +=
            `<button class="btn-small btn-missing" onclick="setStatus('${item.id}','desaparecido','${type}'); closeModal();">Marcar desaparecido</button>`;
        } else {
          actionsHtml +=
            `<button class="btn-small btn-found" onclick="setStatus('${item.id}','encontrado','${type}'); closeModal();">Marcar encontrado</button>`;
        }
        if (isLocalhost) {
          actionsHtml +=
            `<button class="btn-small btn-delete" onclick="removeItem('${item.id}','${type}'); closeModal();">✕ Eliminar</button>`;
        }
      } else if (type === "building") {
        const s = item.status || "seguro";
        actionsHtml += `<button class="btn-small btn-seguro${s === "seguro" ? " btn-active" : ""}" ${s === "seguro" ? "disabled" : ""} onclick="setStatusB('${item.id}','seguro'); closeModal();">Seguro</button>`;
        actionsHtml += `<button class="btn-small btn-danado${s === "danado" ? " btn-active" : ""}" ${s === "danado" ? "disabled" : ""} onclick="setStatusB('${item.id}','danado'); closeModal();">Dañado</button>`;
        actionsHtml += `<button class="btn-small btn-colapsado${s === "colapsado" ? " btn-active" : ""}" ${s === "colapsado" ? "disabled" : ""} onclick="setStatusB('${item.id}','colapsado'); closeModal();">Colapsado</button>`;
        if (isLocalhost) {
          actionsHtml +=
            `<button class="btn-small btn-delete" onclick="removeB('${item.id}'); closeModal();">✕ Eliminar</button>`;
        }
      }
      modalActions.innerHTML = actionsHtml;

      // --- Abrir modal y actualizar URL ---
      modal.classList.add("open");
      const url = new URL(window.location);
      url.searchParams.set("id", item.id);
      url.searchParams.set("type", type);
      window.history.replaceState({}, "", url);

    // Función para subir foto de mascota a Cloudinary
    async function uploadPetPhoto(petId, file) {
      const formData = new FormData();
      formData.append("file", file);
      formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, {
          method: "POST",
          body: formData,
        });
        const data = await res.json();
        if (!data.secure_url) throw new Error("No se obtuvo secure_url");
        await fetch(`${API_BASE}/pets/${petId}/photo`, {
          method: "PATCH",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({photo_url: data.secure_url}),
        });
        return data.secure_url;
      } catch (err) {
        alert("El reporte se guardó, pero la foto no se pudo subir. Intenta agregarla de nuevo abriendo el reporte.");
        console.error(err);
        return null;
      }
    }

      set("tabPetsBtn", petsData.length);
      set("tabEdificiosBtn", buildingsData.length);
      set("tabAnunciosBtn", anunciosData.length);
      set("tabColabBtn", colabData.length);
    }

    function colabCardHtml(item) {
      const date = new Date(item.created_at).toLocaleString("es-CO", {
        day: "2-digit", month: "2-digit",
        hour: "2-digit", minute: "2-digit"
      });
      const metaParts = [];
      if (item.city) metaParts.push(escapeHtml(item.city));
      if (item.contact) metaParts.push(escapeHtml(item.contact));
      metaParts.push(date);
      return `
        <div class="card" data-id="${item.id}">
          <div class="card-main">
            <div class="card-inner">
              <div class="info">
                <span class="name">🤝 ${escapeHtml(item.name)}</span>
                ${item.skill ? `<span class="meta">${escapeHtml(item.skill)}</span>` : ""}
                <span class="meta">${metaParts.join(" · ")}</span>
              </div>
            </div>
            <div class="actions">
              ${isLocalhost
          ? `<button class="btn-small btn-delete" onclick="removeColab('${item.id}')">✕</button>`
          : ''}
            </div>
          </div>
        </div>
      `;
    }

    function renderColab() {
      if (!colabData.length) {
        listElColab.innerHTML = `<div class="empty">Todavía nadie se ha unido como colaborador.</div>`;
        return;
      }
      renderVirtualList(listElColab, colabData, colabCardHtml);
    }

    formColab.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInputColab.value.trim();
      if (!name) return;
      await fetch(`${API_BASE}/collaborators`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name,
          skill: skillInputColab.value.trim(),
          contact: contactInputColab.value.trim(),
          city: cityInputColab.value.trim(),
        }),
      });
      nameInputColab.value = "";
      skillInputColab.value = "";
      contactInputColab.value = "";
      cityInputColab.value = "";
      loadListColab();
    });

    async function removeColab(id) {
      if (!confirm("¿Quitar este colaborador?")) return;
      const ok = await adminDelete(`${API_BASE}/collaborators/${id}`);
      if (ok) loadListColab();
    }

    // Deep link: #anuncio/ abre directamente ese anuncio en su modal.
    function handleAnuncioDeepLink() {
      const match = location.hash.match(/^#anuncio\/(.+)$/);
      if (!match) return;
      const id = decodeURIComponent(match[1]);
      const item = anunciosData.find((a) => a.id === id);
      if (!item) return;
      switchTab(tabAnunciosBtn, tabAnuncios, "anuncio");
      openModalForItem(item, "anuncio");
    }

    // ================================================================
    //  ACCIONES COMPARTIDAS
    // ================================================================
    async function setStatus(id, status, type) {
      const endpoint = type === "person" ? "disappeared" : type === "pet" ? "pets" : "";
      if (!endpoint) return;
      await fetch(`${API_BASE}/${endpoint}/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      if (type === "person") loadList();
      else if (type === "pet") loadListP();
    }

    async function removeItem(id, type) {
      if (!confirm("¿Eliminar este reporte?")) return;
      const endpoint = type === "person" ? "disappeared" : type === "pet" ? "pets" : "";
      if (!endpoint) return;
      const ok = await adminDelete(`${API_BASE}/${endpoint}/${id}`);
      if (ok) {
        if (type === "person") loadList();
        else if (type === "pet") loadListP();
      }
    }

    async function setStatusB(id, status) {
      await fetch(`${API_BASE}/buildings/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      loadListB();
    }

    async function removeB(id) {
      if (!confirm("¿Eliminar este edificio?")) return;
      const ok = await adminDelete(`${API_BASE}/buildings/${id}`);
      if (ok) loadListB();
    }

    // ================================================================
    //  ABRIR MODAL DESDE URL
    // ================================================================
    let modalOpenedFromUrl = false;
    let urlModalAttempts = 0;
    const MAX_URL_ATTEMPTS = 6;

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {id: params.get("id"), type: params.get("type")};
    }

    function tryOpenModalFromUrl() {
      if (modalOpenedFromUrl) return true;
      const {id, type} = getUrlParams();
      if (!id || !type || type === "anuncio") return true;

      let dataArray = null;
      if (type === "person") dataArray = personsData;
      else if (type === "pet") dataArray = petsData;
      else if (type === "building") dataArray = buildingsData;
      else return true;

      if (!dataArray || dataArray.length === 0) return false;

      const item = dataArray.find(i => i.id === id);
      if (item) {
        if (type === "person") switchTab(tabPersonasBtn, tabPersonas, "person");
        else if (type === "pet") switchTab(tabPetsBtn, tabPets, "pet");
        else if (type === "building") switchTab(tabEdificiosBtn, tabEdificios, "building");
        setTimeout(() => {
          openModalForItem(item, type);
          modalOpenedFromUrl = true;
        }, 50);
        return true;
      }
      return false;
    }

    function attemptUrlModal() {
      if (modalOpenedFromUrl) return;
      if (urlModalAttempts >= MAX_URL_ATTEMPTS) return;
      urlModalAttempts++;
      const ok = tryOpenModalFromUrl();
      if (!ok) setTimeout(attemptUrlModal, 400);
    }

    // ================================================================
    //  INICIO Y AUTO-REFRESH
    // ================================================================
    loadList();
    loadListP();
    loadListB();
    loadListColab();
    loadListA().then(handleAnuncioDeepLink);

    setTimeout(attemptUrlModal, 300);
    // Leer parámetro "tab" de la URL al cargar la página
    function applyTabFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const tab = params.get("tab");
      if (tab && tabMap[tab]) {
        const {btn, panel} = tabMap[tab];
        // Si la pestaña es la misma que la activa, no hacer nada (evita doble render)
        if (!btn.classList.contains("active")) {
          switchTab(btn, panel, tab);
        }
      }
      // Si no hay parámetro o es inválido, ya está activa "person" por defecto
    }

    // Ejecutar después de que todo esté cargado
    setTimeout(applyTabFromUrl, 100);


  </script>

  <!-- Leaflet CSS y JS para el mapa -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    function initMap() {
      // Centro aproximado de Colombia
      const colombiaCenter = [4.5709, -74.2973];
      const map = L.map('map', {
        center: colombiaCenter,
        zoom: 6,
        minZoom: 5,
        maxBounds: [
          [-5.0, -82.0], // Suroeste (lat mín, lon mín)
          [13.0, -66.0]  // Noreste (lat máx, lon máx)
        ],
        maxBoundsViscosity: 1.0 // Evita que el usuario pueda arrastrar fuera de los límites
      });

      // Capa de OpenStreetMap
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);

      // Guardar referencia global para poder redimensionar
      window.map = map;

      renderCityMarkers();
      renderMapMarkers();
    }

    let cityMarkersLayer = null;

    function renderCityMarkers() {
      if (!window.map || cityMarkersLayer) return; // solo una vez
      cityMarkersLayer = L.layerGroup().addTo(window.map);

      Object.entries(cityCoordinates).forEach(([name, coords]) => {
        L.marker(coords, {
          icon: L.divIcon({
            className: "city-pin",
            html: `<div class="city-pin-dot"></div>`,
            iconSize: [14, 14],
            iconAnchor: [7, 7],
          }),
          zIndexOffset: -1000, // por debajo de los marcadores de reportes
        })
          .addTo(cityMarkersLayer)
          .bindTooltip(name, {permanent: false, direction: "top"});
      });
    }

    let mapMarkersLayer = null;

    const MAP_MARKER_META = {
      person: {emoji: "🫂", color: "#d64545", data: () => personsData, tabArgs: () => [tabPersonasBtn, tabPersonas, "person"]},
      pet: {emoji: "🐕", color: "#3fa34d", data: () => petsData, tabArgs: () => [tabPetsBtn, tabPets, "pet"]},
      building: {emoji: "🏢", color: "#e0a63c", data: () => buildingsData, tabArgs: () => [tabEdificiosBtn, tabEdificios, "building"]},
    };

    function renderMapMarkers() {
      if (!window.map) return;
      if (mapMarkersLayer) window.map.removeLayer(mapMarkersLayer);
      mapMarkersLayer = L.layerGroup().addTo(window.map);

      Object.keys(MAP_MARKER_META).forEach(type => {
        const {emoji, color, data} = MAP_MARKER_META[type];
        data().forEach(item => {
          if (item.lat == null || item.lng == null) return;
          L.marker([item.lat, item.lng], {
            icon: L.divIcon({
              className: "",
              html: `<div style="
                background:${color};
                width:28px;
                height:28px;
                border-radius:50%;
                display:flex;
                align-items:center;
                justify-content:center;
                font-size:14px;
                border:2px solid rgba(255,255,255,0.6);
                box-shadow:0 2px 6px rgba(0,0,0,0.4);
              ">${emoji}</div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14],
            }),
          })
            .addTo(mapMarkersLayer)
            .bindPopup(`
              ${emoji} <strong>${escapeHtml(item.name)}</strong><br>
              ${item.status ? `<span class="status-tag ${item.status}">${item.status}</span><br>` : ""}
              <a href="#" onclick="window.__mapPopupOpen('${item.id}','${type}'); return false;">Ver detalle</a>
            `);
        });
      });
    }

    window.__mapPopupOpen = function (id, type) {
      const meta = MAP_MARKER_META[type];
      if (!meta) return;
      const item = meta.data().find(i => i.id === id);
      if (!item) return;
      switchTab(...meta.tabArgs());
      openModalForItem(item, type);
    };
  </script>
