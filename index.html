<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sismo API</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1115;
      color: #eaeaea;
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 12px 0;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1a1d24;
      color: #888;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #d64545;
      color: white;
    }

    #addForm {
      display: flex;
      flex-wrap: wrap;
    }

    #addForm input {
      min-width: 200px;
    }

    .tab-panel {
      display: none;
      padding: 5px;
    }

    .tab-panel.active {
      display: block;
    }

    form {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .search-row {
      margin-bottom: 16px;
    }

    input[type="text"],
    input[type="search"],
    select {
      flex: 1;
      min-width: 100px;
      padding: 12px;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #333;
      background: #1a1d24;
      color: #eaeaea;
    }

    input[type="search"] {
      width: 100%;
    }

    button {
      padding: 12px 16px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      background: #d64545;
      color: white;
      cursor: pointer;
      transition: background 0.15s;
    }

    button:hover {
      background: #b53838;
    }

    button:active {
      background: #9a2f2f;
    }

    #gpsBtn,
    #gpsBtnB {
      flex: 0 0 auto;
      background: #333;
    }

    #gpsBtn:hover,
    #gpsBtnB:hover {
      background: #444;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card {
      background: #1a1d24;
      border-radius: 10px;
      padding: 12px 14px;
      gap: 5px;
      display: flex;
      flex-direction: column;
      border-left: 4px solid #d64545;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .card:hover {
      background: #22262e;
    }

    .card:active {
      transform: scale(0.99);
    }

    .card-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card.encontrado,
    .card.seguro {
      border-left-color: #3fa34d;
    }

    .card.danado {
      border-left-color: #e0a63c;
    }

    .card.colapsado {
      border-left-color: #b53838;
    }

    .card .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex: 1;
    }

    .card .name {
      font-weight: 600;
      font-size: 1.05rem;
    }

    .card .meta {
      font-size: 0.8rem;
      color: #999;
    }

    .card .actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 6px;
      pointer-events: auto;
    }

    .btn-small {
      padding: 8px 10px;
      font-size: 0.85rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-small:hover {
      filter: brightness(1.15);
    }

    .btn-found,
    .btn-seguro {
      background: #3fa34d;
      color: white;
    }

    .btn-missing,
    .btn-colapsado {
      background: #d64545;
      color: white;
    }

    .btn-danado {
      background: #e0a63c;
      color: #222;
    }

    .btn-delete {
      background: #333;
      color: #ccc;
    }

    .btn-delete:hover {
      background: #444;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 40px 0;
    }

    .status-tag {
      font-size: 0.7rem;
      text-transform: uppercase;
      padding: 2px 8px;
      border-radius: 4px;
      background: #d64545;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .status-tag.encontrado,
    .status-tag.seguro {
      background: #3fa34d;
    }

    .status-tag.danado {
      background: #e0a63c;
      color: #222;
    }

    .status-tag.colapsado {
      background: #b53838;
    }

    /* Modal */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 16px;
      animation: modalFade 0.2s ease-out;
    }

    .modal.open {
      display: flex;
    }

    @keyframes modalFade {
      from {
        opacity: 0;
        transform: scale(0.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-content {
      background: #1a1d24;
      border-radius: 14px;
      padding: 24px 28px 28px;
      max-width: 500px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      position: relative;
      border: 1px solid #2a2e36;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .modal-content::-webkit-scrollbar {
      width: 4px;
    }

    .modal-content::-webkit-scrollbar-track {
      background: transparent;
    }

    .modal-content::-webkit-scrollbar-thumb {
      background: #444;
      border-radius: 4px;
    }

    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: #2a2e36;
      border: none;
      color: #aaa;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .modal-close:hover {
      background: #3a3e46;
      color: #eee;
    }

    .modal-close:active {
      background: #4a4e56;
    }

    .modal-content h2 {
      margin: 0 0 6px 0;
      font-size: 1.4rem;
      padding-right: 30px;
      word-break: break-word;
    }

    .modal-status {
      display: inline-block;
      margin-bottom: 12px;
    }

    .modal-meta {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 4px;
      line-height: 1.6;
    }

    .modal-meta span {
      display: inline-block;
      margin-right: 12px;
    }

    .modal-divider {
      height: 1px;
      background: #2a2e36;
      margin: 16px 0;
    }

    .modal-placeholder {
      background: #12151c;
      border-radius: 10px;
      padding: 20px 18px;
      text-align: center;
      border: 1px dashed #2a2e36;
      color: #666;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
    }

    .modal-placeholder strong {
      color: #888;
      font-weight: 600;
    }

    .modal-placeholder .icon {
      font-size: 1.6rem;
      display: block;
      margin-bottom: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid #2a2e36;
    }

    .modal-actions button {
      flex: 1;
      min-width: 80px;
    }

    .modal-actions .btn-small {
      flex: 1;
      min-width: 80px;
      padding: 10px 12px;
      font-size: 0.9rem;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .modal-content {
        padding: 18px 16px 20px;
      }

      .modal-content h2 {
        font-size: 1.2rem;
      }

      .modal-actions button {
        min-width: 60px;
        font-size: 0.8rem;
        padding: 8px 10px;
      }
    }
  </style>
</head>

<body>
  <div style="padding: 5px">
    <h1>🚨 Sismo API - ADMIN: +57 3153410282</h1>
    <button style="margin-bottom: 5px; background: teal" onclick="navigator.clipboard?.writeText('http://neokpm.xyz')">
      http://neokpm.xyz (COPIAR LINK)
    </button>
  </div>
  <div id="driver" style="
        padding: 5px;
        position: sticky;
        top: 0px;
        background: rgba(20, 20, 20, 0.85);
        backdrop-filter: blur(5px);
        border-bottom: 2px solid gray;
        margin-bottom: 5px;
        z-index: 100;
      ">
    <div class="tabs">
      <button class="tab-btn active" id="tabPersonasBtn">🫂 Personas</button>
      <button class="tab-btn" id="tabEdificiosBtn">🏢 Ubicaciones</button>
    </div>
    <div class="search-row">
      <input type="search" id="searchInput" placeholder="🔍 Buscar por nombre, ubicación o ciudad..." />
    </div>
  </div>

  <!-- Panel Personas -->
  <div id="tabPersonas" class="tab-panel active">
    <div style="
          border: 1px solid gray;
          padding: 5px;
          border-radius: 10px;
          margin-bottom: 5px;
          background: teal;
        ">
      (+) CREAR
      <form id="addForm" style="margin-top: 5px">
        <input type="text" id="nameInput" placeholder="Nombre de la persona" required />
        <input type="text" id="locationInput" placeholder="Ubicación (opcional)" />
        <select id="cityInput">
          <option value="">Ciudad</option>
        </select>
        <button type="button" id="gpsBtn" title="Usar mi ubicación">
          📍
        </button>
        <button type="submit">Reportar</button>
      </form>
    </div>
    <div id="list" class="list"></div>
  </div>

  <!-- Panel Edificios -->
  <div id="tabEdificios" class="tab-panel">
    <form id="addFormB">
      <input type="text" id="nameInputB" placeholder="Nombre o dirección del edificio" required />
      <input type="text" id="locationInputB" placeholder="Ubicación (opcional)" />
      <select id="cityInputB">
        <option value="">Ciudad</option>
      </select>
      <button type="button" id="gpsBtnB" title="Usar mi ubicación">📍</button>
      <button type="submit">Reportar</button>
    </form>
    <div class="search-row">
      <input type="search" id="searchInputB" placeholder="🔍 Buscar por nombre, ubicación o ciudad..." />
    </div>
    <div id="listB" class="list"></div>
  </div>

  <!-- Modal overlay -->
  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
      <button class="modal-close" aria-label="Cerrar">✕</button>
      <div class="modal-status" id="modalStatus"></div>
      <h2 id="modalTitle"></h2>
      <div id="modalMeta" class="modal-meta"></div>
      <div class="modal-divider"></div>
      <div id="modalBody"></div>
      <div class="modal-divider"></div>
      <div class="modal-placeholder">
        <span class="icon">📋</span>
        <strong>MAS INFO PRONTO</strong>
        <div style="font-size:0.8rem; margin-top:4px; color:#555;">Estamos trabajando en más detalles para este reporte.
        </div>
      </div>
      <div id="modalActions" class="modal-actions"></div>
    </div>
  </div>

  <script>
    const API_BASE =
      location.hostname === "localhost" || location.hostname === "127.0.0.1" ?
        "https://neokpm.xyz/api" :
        "/api";

    // Cargar ciudades
    fetch("/cities.json")
      .then((r) => r.json())
      .then((cities) => {
        const opts = cities.map((c) => `<option value="${c}">${c}</option>`).join("");
        document.getElementById("cityInput").insertAdjacentHTML("beforeend", opts);
        document.getElementById("cityInputB").insertAdjacentHTML("beforeend", opts);
      })
      .catch(() => console.error("No se pudo cargar cities.json"));

    // Tabs
    const tabPersonasBtn = document.getElementById("tabPersonasBtn");
    const tabEdificiosBtn = document.getElementById("tabEdificiosBtn");
    const tabPersonas = document.getElementById("tabPersonas");
    const tabEdificios = document.getElementById("tabEdificios");

    tabPersonasBtn.addEventListener("click", () => {
      tabPersonasBtn.classList.add("active");
      tabEdificiosBtn.classList.remove("active");
      tabPersonas.classList.add("active");
      tabEdificios.classList.remove("active");
      document.getElementById("searchInput").value = "";
      render();
    });
    tabEdificiosBtn.addEventListener("click", () => {
      tabEdificiosBtn.classList.add("active");
      tabPersonasBtn.classList.remove("active");
      tabEdificios.classList.add("active");
      tabPersonas.classList.remove("active");
      document.getElementById("searchInputB").value = "";
      renderB();
    });

    // Utilities
    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function normalize(str) {
      return (str || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
    }

    function fuzzyMatch(query, target) {
      query = normalize(query);
      target = normalize(target);
      if (!query) return true;
      let qi = 0;
      for (let ti = 0; ti < target.length && qi < query.length; ti++) {
        if (target[ti] === query[qi]) qi++;
      }
      return qi === query.length;
    }

    function fuzzyFilter(query, items) {
      if (!query.trim()) return items;
      return items.filter(
        (item) =>
          fuzzyMatch(query, item.name) ||
          fuzzyMatch(query, item.location || "") ||
          fuzzyMatch(query, item.city || ""),
      );
    }

    async function adminDelete(url) {
      const key = prompt("Clave de administrador:");
      if (!key) return false;
      const r = await fetch(url, {
        method: "DELETE",
        headers: {"x-admin-key": key},
      });
      if (r.status === 403) {
        alert("Clave incorrecta");
        return false;
      }
      return true;
    }

    // Modal logic
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalStatus = document.getElementById("modalStatus");
    const modalMeta = document.getElementById("modalMeta");
    const modalBody = document.getElementById("modalBody");
    const modalActions = document.getElementById("modalActions");
    const modalClose = document.querySelector(".modal-close");

    function closeModal() {
      modal.classList.remove("open");
      modalTitle.textContent = "";
      modalStatus.innerHTML = "";
      modalMeta.innerHTML = "";
      modalBody.innerHTML = "";
      modalActions.innerHTML = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) closeModal();
    });

    function openModalForItem(item, type) {
      // type: 'person' or 'building'
      const statusClass = item.status || "desaparecido";
      const statusLabel = item.status || "desaparecido";

      // Status tag
      modalStatus.innerHTML = `<span class="status-tag ${statusClass}">${statusLabel}</span>`;

      // Title
      modalTitle.textContent = item.name || "Sin nombre";

      // Meta: location, city, date
      const dateStr = item.created_at ? new Date(item.created_at).toLocaleString("es-CO", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }) : "";
      let metaParts = [];
      if (item.city) metaParts.push(`📍 ${escapeHtml(item.city)}`);
      if (item.location) metaParts.push(`🗺️ ${escapeHtml(item.location)}`);
      metaParts.push(`🕒 ${dateStr}`);
      modalMeta.innerHTML = metaParts.map(p => `<span>${p}</span>`).join("");

      // Body: extra info (placeholder for now)
      modalBody.innerHTML = `<div style="color:#888; font-size:0.95rem;">Detalles del reporte</div>`;

      // Actions: same as card buttons
      let actionsHtml = "";
      if (type === "person") {
        if (item.status === "encontrado") {
          actionsHtml +=
            `<button class="btn-small btn-missing" onclick="setStatus('${item.id}','desaparecido'); closeModal();">Marcar desaparecido</button>`;
        } else {
          actionsHtml +=
            `<button class="btn-small btn-found" onclick="confirmSetStatus('${item.id}','encontrado'); closeModal();">Marcar encontrado</button>`;
        }
        actionsHtml +=
          `<button class="btn-small btn-delete" onclick="remove('${item.id}'); closeModal();">✕ Eliminar</button>`;
      } else if (type === "building") {
        actionsHtml +=
          `<button class="btn-small btn-seguro" onclick="setStatusB('${item.id}','seguro'); closeModal();">Seguro</button>`;
        actionsHtml +=
          `<button class="btn-small btn-danado" onclick="setStatusB('${item.id}','danado'); closeModal();">Dañado</button>`;
        actionsHtml +=
          `<button class="btn-small btn-colapsado" onclick="setStatusB('${item.id}','colapsado'); closeModal();">Colapsado</button>`;
        actionsHtml +=
          `<button class="btn-small btn-delete" onclick="removeB('${item.id}'); closeModal();">✕ Eliminar</button>`;
      }
      modalActions.innerHTML = actionsHtml;

      modal.classList.add("open");
    }

    function formatDate(iso) {
      return new Date(iso).toLocaleString("es-CO", {
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      });
    }

    // --- Personas ---
    let personsData = [];
    const listEl = document.getElementById("list");
    const form = document.getElementById("addForm");
    const nameInput = document.getElementById("nameInput");
    const locationInput = document.getElementById("locationInput");
    const cityInput = document.getElementById("cityInput");
    const gpsBtn = document.getElementById("gpsBtn");
    const searchInput = document.getElementById("searchInput");

    async function loadList() {
      try {
        const res = await fetch(`${API_BASE}/disappeared`);
        personsData = await res.json();
        render();
      } catch (err) {
        listEl.innerHTML = `<div class="empty">No se pudo conectar al servidor.</div>`;
      }
    }

    function render() {
      const items = fuzzyFilter(searchInput.value, personsData);
      if (!items.length) {
        listEl.innerHTML =
          `<div class="empty">${personsData.length ? "Sin resultados." : "No hay reportes todavía."}</div>`;
        return;
      }
      listEl.innerHTML = items.map((item) => {
        const found = item.status === "encontrado";
        const date = new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
        const metaParts = [];
        if (item.city) metaParts.push(escapeHtml(item.city));
        if (item.location) metaParts.push(escapeHtml(item.location));
        metaParts.push(date);
        return `
              <div class="card ${found ? "encontrado" : ""}" data-id="${item.id}" data-type="person">
                <div>
                  <span class="status-tag ${found ? "encontrado" : ""}">${item.status}</span>
                </div>
                <div class="card-inner">
                  <div class="info">
                    <span class="name">${escapeHtml(item.name)}</span>
                    <span class="meta">${metaParts.join(" · ")}</span>
                  </div>
                </div>
                <div class="actions">
                  ${found
            ? `<button class="btn-small btn-missing" onclick="setStatus('${item.id}','desaparecido')">Marcar desaparecido</button>`
            : `<button class="btn-small btn-found" onclick="confirmSetStatus('${item.id}','encontrado')">Marcar encontrado</button>`
          }
                  <button class="btn-small btn-delete" onclick="remove('${item.id}')">✕</button>
                </div>
              </div>
            `;
      }).join("");
    }

    // Click on person card → open modal
    listEl.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      const card = e.target.closest(".card");
      if (!card) return;
      const id = card.dataset.id;
      if (!id) return;
      const item = personsData.find(p => p.id === id);
      if (item) openModalForItem(item, "person");
    });

    searchInput.addEventListener("input", render);

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const location = locationInput.value.trim();
      const city = cityInput.value.trim();
      if (!name) return;
      await fetch(`${API_BASE}/disappeared`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, location, city}),
      });
      nameInput.value = "";
      locationInput.value = "";
      cityInput.value = "";
      loadList();
    });

    async function confirmSetStatus(id, status) {
      if (!confirm("¿Confirmar que esta persona fue encontrada?")) return;
      await setStatus(id, status);
    }

    async function setStatus(id, status) {
      await fetch(`${API_BASE}/disappeared/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      loadList();
    }

    async function remove(id) {
      if (!confirm("¿Eliminar este reporte?")) return;
      const ok = await adminDelete(`${API_BASE}/disappeared/${id}`);
      if (ok) loadList();
    }

    gpsBtn.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Geolocalización no disponible.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locationInput.value =
            `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        },
        () => alert("No se pudo obtener la ubicación."),
      );
    });

    // --- Edificios ---
    let buildingsData = [];
    const listElB = document.getElementById("listB");
    const formB = document.getElementById("addFormB");
    const nameInputB = document.getElementById("nameInputB");
    const locationInputB = document.getElementById("locationInputB");
    const cityInputB = document.getElementById("cityInputB");
    const gpsBtnB = document.getElementById("gpsBtnB");
    const searchInputB = document.getElementById("searchInputB");

    async function loadListB() {
      try {
        const res = await fetch(`${API_BASE}/buildings`);
        buildingsData = await res.json();
        renderB();
      } catch (err) {
        listElB.innerHTML = `<div class="empty">No se pudo conectar al servidor.</div>`;
      }
    }

    function renderB() {
      const items = fuzzyFilter(searchInputB.value, buildingsData);
      if (!items.length) {
        listElB.innerHTML =
          `<div class="empty">${buildingsData.length ? "Sin resultados." : "No hay edificios reportados."}</div>`;
        return;
      }
      listElB.innerHTML = items.map((item) => {
        const date = new Date(item.created_at).toLocaleString("es-CO", {
          day: "2-digit",
          month: "2-digit",
          hour: "2-digit",
          minute: "2-digit",
        });
        const metaParts = [];
        if (item.city) metaParts.push(escapeHtml(item.city));
        if (item.location) metaParts.push(escapeHtml(item.location));
        metaParts.push(date);
        const statusClass = item.status || "seguro";
        return `
              <div class="card ${statusClass}" data-id="${item.id}" data-type="building">
                <div>
                  <span class="status-tag ${statusClass}">${item.status || "seguro"}</span>
                </div>
                <div class="card-inner">
                  <div class="info">
                    <span class="name">${escapeHtml(item.name)}</span>
                    <span class="meta">${metaParts.join(" · ")}</span>
                  </div>
                </div>
                <div class="actions">
                  <button class="btn-small btn-seguro" onclick="setStatusB('${item.id}','seguro')">Seguro</button>
                  <button class="btn-small btn-danado" onclick="setStatusB('${item.id}','danado')">Dañado</button>
                  <button class="btn-small btn-colapsado" onclick="setStatusB('${item.id}','colapsado')">Colapsado</button>
                  <button class="btn-small btn-delete" onclick="removeB('${item.id}')">✕</button>
                </div>
              </div>
            `;
      }).join("");
    }

    // Click on building card → open modal
    listElB.addEventListener("click", (e) => {
      if (e.target.closest("button")) return;
      const card = e.target.closest(".card");
      if (!card) return;
      const id = card.dataset.id;
      if (!id) return;
      const item = buildingsData.find(b => b.id === id);
      if (item) openModalForItem(item, "building");
    });

    searchInputB.addEventListener("input", renderB);

    formB.addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = nameInputB.value.trim();
      const location = locationInputB.value.trim();
      const city = cityInputB.value.trim();
      if (!name) return;
      await fetch(`${API_BASE}/buildings`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name, location, city}),
      });
      nameInputB.value = "";
      locationInputB.value = "";
      cityInputB.value = "";
      loadListB();
    });

    async function setStatusB(id, status) {
      await fetch(`${API_BASE}/buildings/${id}`, {
        method: "PATCH",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({status}),
      });
      loadListB();
    }

    async function removeB(id) {
      if (!confirm("¿Eliminar este edificio?")) return;
      const ok = await adminDelete(`${API_BASE}/buildings/${id}`);
      if (ok) loadListB();
    }

    gpsBtnB.addEventListener("click", () => {
      if (!navigator.geolocation) {
        alert("Geolocalización no disponible.");
        return;
      }
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          locationInputB.value =
            `${pos.coords.latitude.toFixed(5)}, ${pos.coords.longitude.toFixed(5)}`;
        },
        () => alert("No se pudo obtener la ubicación."),
      );
    });

    // --- Inicio ---
    loadList();
    loadListB();

    // Auto-refresh cada 10s
    setInterval(() => {
      loadList();
      loadListB();
    }, 10000);
  </script>
</body>

</html>
